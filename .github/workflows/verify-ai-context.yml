# Verifies that the committed AI context (AGENTS.md files, review instructions,
# the .ai/ record) is exactly what the generator produced from this
# repository's sources. If this job is red, its log names each file and the
# remedy for each cause. The two commonest:
# 1. You edited a generated file (its header says "Generated by gravitee-ai").
#    Regenerating discards that edit, so undo it; to change what agents read,
#    add or edit a rule under .ai/rules instead, then regenerate.
# 2. You regenerated but did not commit everything it changed, often
#    .ai/generated.yaml. Commit the record and the generated files together.
# To regenerate, Gravitee staff install gbuddy once: clone
# https://github.com/gravitee-io/gravitee-ai-foundation (internal), run
# ./install.sh there and follow what it prints, including the
# `export GBUDDY_HOME=...` line for your shell profile; the page "Get started
# with gbuddy" in the Builder Experience Confluence space has the full
# walkthrough. Then run `gbuddy setup` from this repository's root and commit
# every file git status then shows changed.
# From a fork, or without access to that repository: do step 1 and push. A
# changed rule without a regeneration only warns and never blocks; ask a
# maintainer, in a comment on the pull request, to regenerate on the branch.
# Green means the tree matches the committed record. It proves neither that
# the record is authentic nor that this check is the real one: on a pull
# request, this workflow and the script run from the pull request's own tree,
# so the author controls all three, and a change to either file is part of
# what the reviewer reads.
# Needs only Node and git, no install and no secrets, so it works on fork pull
# requests; GitHub's default for public repositories holds a first-time
# contributor's run until a maintainer approves it.
name: Verify AI context

on:
    pull_request:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6.1.0
            - run: node .github/scripts/verify-ai-context.mjs
