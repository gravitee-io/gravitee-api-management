@if (settingsResource.isLoading() && !editorReady()) {
  <div class="loading" data-testid="catalog-tile-loading"><gio-loader /></div>
} @else if (settingsResource.error() && !editorReady()) {
  <gio-banner-error data-testid="catalog-tile-load-error">
    Catalog card template could not be loaded.
    <span gioBannerBody>Retry the request or contact your administrator if the problem persists.</span>
    <div gioBannerAction>
      <button mat-stroked-button type="button" (click)="retry()">Retry</button>
    </div>
  </gio-banner-error>
} @else if (editorReady()) {
  <div class="catalog-card-template" data-testid="catalog-card-template-editor">
    <gmd-editor
      class="catalog-card-template__editor"
      [formControl]="contentControl"
      [showPreview]="false"
      data-testid="catalog-card-gmd-editor"
    />
    @if (showPreview()) {
      <hr class="catalog-card-template__divider" />
      <div class="catalog-card-template__preview" data-testid="catalog-card-preview">
        <gmd-viewer [content]="previewContent()" />
      </div>
    }
  </div>
}
