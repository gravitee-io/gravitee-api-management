<span mat-dialog-title>Assign APIs</span>

<mat-dialog-content class="assign-apis-dialog__content">
  <gio-banner-info data-testid="classic-portal-banner">
    API consumers cannot subscribe to an API with a subscription form from the Classic Portal.
  </gio-banner-info>

  <subscription-form-apis
    [selectedApis]="draft()"
    [mappedElsewhere]="data.mappedElsewhere"
    [canUpdate]="data.canUpdate"
    (apiToggled)="toggle($event)"
  />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" data-testid="assign-apis-cancel-button" (click)="cancel()">
    {{ data.canUpdate ? 'Cancel' : 'Close' }}
  </button>
  @if (data.canUpdate) {
    <button mat-flat-button color="primary" type="button" data-testid="assign-apis-apply-button" (click)="apply()">Apply</button>
  }
</mat-dialog-actions>
