<gio-table-wrapper
  [searchLabel]="'Search'"
  [length]="total()"
  [filters]="filters()"
  [disablePaginator]="true"
  (filtersChange)="onFiltersChanged($event)"
>
  <table mat-table [dataSource]="pagedForms()" aria-label="Subscription forms table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let form">
        <span>{{ form.name }}</span>
        @if (form.defaultForm) {
          <span class="gio-badge-primary default-badge" [attr.data-testid]="'default-badge-' + form.id">Default</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="enabled">
      <th mat-header-cell *matHeaderCellDef>Enabled</th>
      <td mat-cell *matCellDef="let form">
        <mat-slide-toggle
          [checked]="form.enabled"
          [disabled]="!canUpdate()"
          [attr.aria-label]="'Enabled — ' + form.name"
          [attr.data-testid]="'enable-toggle-' + form.id"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
          (change)="toggleEnabled.emit(form)"
        ></mat-slide-toggle>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let form; columns: displayedColumns"
      role="button"
      tabindex="0"
      [class.selected]="form.id === selectedFormId()"
      [attr.data-testid]="'subscription-form-row-' + form.id"
      (click)="selectForm.emit(form)"
      (keydown.enter)="selectForm.emit(form)"
    ></tr>

    <tr class="mat-mdc-row mdc-data-table__row" *matNoDataRow>
      <td class="mat-mdc-cell mdc-data-table__cell" [attr.colspan]="displayedColumns.length">
        <span data-testid="subscription-form-empty">No subscription forms yet.</span>
      </td>
    </tr>
  </table>
</gio-table-wrapper>
