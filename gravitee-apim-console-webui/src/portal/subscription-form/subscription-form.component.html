<main class="page-layout">
  <section class="panel sections-panel" [style.width.px]="panelWidth()">
    <header class="panel-header sections-panel__header">
      <h3>Subscription Forms</h3>
      <div class="panel-header__actions">
        <button
          *gioPermission="{ anyOf: ['environment-metadata-c'] }"
          mat-stroked-button
          type="button"
          aria-label="Add subscription form"
          data-testid="create-subscription-form-button"
          (click)="startCreate()"
        >
          <mat-icon>add</mat-icon>
          Add
        </button>
      </div>
    </header>

    <div class="sections-panel__tree__container">
      <subscription-form-list
        [forms]="listedForms()"
        [selectedFormId]="selectedForm()?.id ?? null"
        [canUpdate]="canUpdate()"
        (selectForm)="selectForm($event)"
        [canDelete]="canDelete()"
        (toggleEnabled)="onEnabledToggle($event)"
        (deleteForm)="deleteForm($event)"
      />
    </div>
  </section>

  <div
    class="resize-handle-container"
    role="separator"
    tabindex="0"
    aria-label="Resize subscription forms panel"
    aria-orientation="vertical"
    aria-valuemin="280"
    aria-valuemax="600"
    [attr.aria-valuenow]="panelWidth()"
    data-testid="subscription-form-resize-handle"
    (mousedown)="onResizeStart($event)"
    (keydown)="onResizeKeydown($event)"
  >
    <hr class="resize-handle" aria-hidden="true" />
    <mat-icon svgIcon="gio:drag-indicator"></mat-icon>
  </div>

  <section class="panel editor-panel">
    <header class="panel-header editor-panel__header">
      @if (hasSelection()) {
        <div class="panel-header__title">
          <mat-form-field appearance="outline" subscriptSizing="dynamic" class="panel-header__title__field">
            <input
              id="subscription-form-name"
              matInput
              [formControl]="nameControl"
              required
              placeholder="Name"
              aria-label="Name"
              data-testid="subscription-form-name-input"
            />
          </mat-form-field>
        </div>
      }
      <div class="panel-header__actions">
        @if (hasSelection()) {
          <button
            mat-stroked-button
            type="button"
            data-testid="toggle-preview-button"
            [attr.aria-pressed]="isPreviewVisible()"
            (click)="togglePreview()"
          >
            Toggle preview
          </button>
        }
        <button
          *gioPermission="{ anyOf: ['environment-metadata-u'] }"
          mat-flat-button
          color="primary"
          type="button"
          [disabled]="isSaveDisabled()"
          data-testid="subscription-form-save-button"
          (click)="save()"
        >
          {{ saveButtonLabel() }}
        </button>
      </div>
    </header>

    @if (hasSelection()) {
      <gmd-form-editor [formControl]="contentControl" [showPreview]="isPreviewVisible()" />
      <subscription-form-apis
        [selectedApis]="selectedApis()"
        [mappedElsewhere]="apisMappedElsewhere()"
        [canUpdate]="canUpdate()"
        (apiToggled)="toggleApi($event)"
      />
    } @else {
      <div class="empty-editor">
        <mat-card appearance="outlined" class="empty-state">
          <mat-card-content>
            <empty-state
              iconName="gio:code"
              title="Subscription form"
              message="Select a form from the list to edit it, or create a new one."
            />
          </mat-card-content>
        </mat-card>
      </div>
    }
  </section>
</main>
