<mat-card
  class="ai-workspace-card"
  appearance="outlined"
  role="button"
  tabindex="0"
  [attr.aria-label]="openLabel()"
  (click)="cardSelect.emit(workspaceId())"
  (keydown.enter)="cardSelect.emit(workspaceId())"
  (keydown.space)="$event.preventDefault(); cardSelect.emit(workspaceId())"
>
  <mat-card-content class="ai-workspace-card__content">
    <div class="ai-workspace-card__title next-gen-h5" data-testid="ai-workspace-card-title" [matTooltip]="title()" appMatTooltipOnEllipsis>
      {{ title() }}
    </div>

    <div class="ai-workspace-card__description next-gen-body" data-testid="ai-workspace-card-description">
      @if (description()) {
        {{ description() }}
      } @else {
        <span i18n="@@aiWorkspaceDescriptionMissing">No description provided.</span>
      }
    </div>

    <div class="ai-workspace-card__budget next-gen-small-bold" data-testid="ai-workspace-card-budget">
      <span i18n="@@aiWorkspaceBudgetLabel">Budget allotted</span>
      @if (budgetLabel()) {
        <span>{{ budgetLabel() }}</span>
      } @else {
        <span i18n="@@aiWorkspaceBudgetUnavailable">Unavailable</span>
      }
    </div>
  </mat-card-content>
</mat-card>
