<div class="global-search">
  <div class="global-search__header">
    <div class="global-search__field">
      <mat-icon class="global-search__search-icon" aria-hidden="true">search</mat-icon>
      <input
        #searchInput
        class="global-search__input next-gen-body"
        type="search"
        [formControl]="searchControl"
        placeholder="Search..."
        i18n-placeholder="@@globalSearchDialogPlaceholder"
        autocomplete="off"
      />
    </div>
    <button
      mat-icon-button
      type="button"
      class="global-search__close"
      aria-label="Close search"
      i18n-aria-label="@@globalSearchDialogClose"
      (click)="close()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="global-search__body">
    @if (loading()) {
      <div class="global-search__loading">
        <app-loader />
      </div>
    } @else if (!hasQuery()) {
      <div class="global-search__empty">
        <div class="global-search__empty-icon" aria-hidden="true">
          <mat-icon>search</mat-icon>
        </div>
        <div class="global-search__empty-copy">
          <h2 class="global-search__empty-title next-gen-h5" i18n="@@globalSearchDialogEmptyTitle">Search</h2>
          <p class="global-search__empty-text next-gen-body" i18n="@@globalSearchDialogEmptyHint">
            Start typing to search for API and documentation.
          </p>
        </div>
      </div>
    } @else if (results().length === 0) {
      <div class="global-search__empty global-search__empty--compact">
        <p class="global-search__empty-text next-gen-body" i18n="@@globalSearchDialogNoResults">No results found.</p>
      </div>
    } @else {
      <ul class="global-search__results" role="listbox">
        @for (result of results(); track result.kind + result.navItemId) {
          <li>
            <button type="button" class="global-search__result" role="option" (click)="selectResult(result)">
              <mat-icon class="global-search__result-icon" aria-hidden="true">{{ resultIcon(result.kind) }}</mat-icon>
              <span class="global-search__result-text">
                <span class="global-search__result-title next-gen-body-strong">{{ result.title }}</span>
                <span class="global-search__result-meta next-gen-caption">
                  {{ resultKindLabel(result.kind) }}
                  @if (result.matchIn === 'content') {
                    ·
                    <span i18n="@@globalSearchResultMatchContent">Content match</span>
                  }
                  @if (result.subtitle) {
                    · {{ result.subtitle }}
                  }
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
