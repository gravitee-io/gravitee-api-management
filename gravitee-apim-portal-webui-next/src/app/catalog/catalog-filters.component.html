<div class="catalog-filters__title next-gen-caption" i18n="@@catalogFiltersTitle">Filters</div>

@for (section of sections(); track section.key) {
  <section class="catalog-filters__section" [attr.data-testid]="'section-' + section.key">
    <button
      #firstHeader
      type="button"
      class="catalog-filters__header"
      [attr.data-testid]="'filter-' + section.key"
      [attr.aria-expanded]="!section.collapsed"
      (click)="toggleSection(section.key)"
    >
      <span class="catalog-filters__name next-gen-body-strong">{{ section.label }}</span>
      <mat-icon aria-hidden="true">{{ section.collapsed ? 'add' : 'remove' }}</mat-icon>
    </button>

    @if (!section.collapsed) {
      <ul class="catalog-filters__values">
        @for (value of section.values; track value.value) {
          <li>
            <mat-checkbox [checked]="value.picked" (change)="toggle(section.key, value.value)">
              <span class="catalog-filters__value">{{ value.label }}</span>
            </mat-checkbox>
            <span class="catalog-filters__count next-gen-caption">{{ value.count }}</span>
          </li>
        }
      </ul>
    }
  </section>
}
