version: '3.8'

services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-jammy
    container_name: gravitee-apim-e2e-playwright
    working_dir: /test
    # The image ships Yarn 1, which refuses to run a project declaring `packageManager: yarn@4`.
    # Corepack activates the pinned version so the container runs the same script as everyone else.
    # Base URLs come from the environment below rather than the image, so the command stays generic.
    command: sh -c "corepack enable && yarn pw:ci"
    volumes:
      - ./:/test
    environment:
      - CI=true
      - CONSOLE_BASE_URL=http://nginx/console/
      - MANAGEMENT_BASE_URL=http://nginx/management
      - GATEWAY_BASE_URL=http://nginx/gateway
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - apim
