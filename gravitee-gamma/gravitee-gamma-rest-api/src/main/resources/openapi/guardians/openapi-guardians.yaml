openapi: 3.0.3
info:
    title: Gravitee.io Gamma - Guardians
    description: |
        Manage and deploy Guardians: named, reusable guardrail sequences defined at environment
        level and attached to LLM proxies. Saving a Guardian updates its draft; the `_deploy`
        endpoint publishes that draft to the gateway.

        **The environment is carried by the path.** Request and response payloads expose the
        guardrail sequence and resources as structured fields, rather than a serialized `definition`
        blob. A `PUT` replaces the complete draft, including its sequence and resources.

        **Nothing here is generated.** The gamma rest-api has no OpenAPI generator wired, so the
        request and response bodies are hand-written Java records and this file is documentation
        kept in step with them by hand. If the two ever disagree, the records are the truth.

        **Timestamps are ISO 8601 strings in UTC** — `"2026-11-07T10:00:01.119Z"`. The host's object
        mapper would write a date as a fractional epoch number, so the DTOs of this surface
        set the format themselves; the offset is always `Z`, never the server's.

        **A Guardian is its definition.** Creation and update both carry the whole thing — name,
        phase, API types, guardrail sequence and resources — and a `PUT` replaces it rather than
        patching it. Five fields are the store's and not the caller's: `id`, which comes from the
        path, `lifecycleState` and `deployedAt`, which come from the latest deployment, and `createdAt` and
        `updatedAt`. An update accepts all five and ignores them, so the response of a `GET` can be
        sent straight back.

        **A name is unique within an environment**, compared without regard to case: a creation or a
        rename onto a name another Guardian of the environment carries answers 409.

        **Only `llm-proxy` guardians can be written** in 4.14; any other value in `apiTypes` is
        refused. Reads accept every API type the platform knows, so a row written by another writer
        never breaks the list.
    contact:
        email: team-apim@graviteesource.com
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    version: 1.0.0

security:
    - CookieAuth: []

servers:
    - url: "/gamma"
      description: Gravitee.io Gamma host application

tags:
    - name: Guardians
      description: |
          Reusable guardrail sequences of an environment. Every operation requires the
          `ENVIRONMENT_GUARDIAN` permission with the action matching the verb, so holding read
          rights never grants creation. An organization admin bypasses the check.

paths:
    /organizations/{orgId}/environments/{envId}/guardians:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
        get:
            tags:
                - Guardians
            summary: List the Guardians of the environment
            description: |
                Paged and searchable by name. `q` is matched as **literal text**, not as a pattern:
                the two storage backends match it differently under the hood, so it is escaped
                before it reaches either.
            operationId: searchGuardians
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Case-insensitive substring of the name. Literal text, not a pattern.
                  schema:
                      type: string
                - name: page
                  in: query
                  required: false
                  description: 1-based page number.
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: perPage
                  in: query
                  required: false
                  description: |
                      Rows per page. Capped at 100; a value above the cap is served as 100, and a
                      value of 0 or less falls back to the default. The `perPage` reported in the
                      response is always the size actually served, never the number of rows the
                      page happens to hold.
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                - name: sortBy
                  in: query
                  required: false
                  description: |
                      One of the sortable fields, prefixed with `-` for descending order. Any other
                      value is refused with 400 rather than silently ignored.

                      `apiType` is absent because a Guardian carries its API types as a set: there is
                      no single value to order rows by. `deployedAt` is derived from the latest
                      publication when the page is read, so it is not a sortable stored draft field.
                  schema:
                      type: string
                      default: "-updatedAt"
                      enum:
                          - name
                          - "-name"
                          - phase
                          - "-phase"
                          - createdAt
                          - "-createdAt"
                          - updatedAt
                          - "-updatedAt"
            responses:
                "200":
                    description: A page of Guardians.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GuardiansResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - Guardians
            summary: Create a Guardian
            description: |
                The id comes from the request, as every resource-creation endpoint on this surface
                does; omit it and the server assigns one. A Guardian is created **undeployed**:
                storing a definition is not deploying it.

                The body is the whole definition: the guardrail sequence and the resources travel
                with the general settings rather than through a second endpoint.
            operationId: createGuardian
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateGuardian"
            responses:
                "201":
                    description: The Guardian as created, with a `Location` header pointing at it.
                    headers:
                        Location:
                            description: URL of the created Guardian.
                            schema:
                                type: string
                                format: uri
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Guardian"
                "400":
                    description: |
                        The payload is not acceptable: a missing or blank name, a name over 512
                        characters, a missing phase, an empty `apiTypes` or one holding a type other
                        than `llm-proxy`, an `id` that is not a UUID or is already taken, or a key
                        the schema does not declare.

                        The body of a refusal carries `message` and `http_status`, except for the
                        schema constraints — name, description, phase, `apiTypes`, `id` shape — which
                        the host's bean-validation mapper answers with `message`, `path`,
                        `invalid_value` and `details`. Those constraints are declared on the domain's
                        own create and update commands rather than on the HTTP body, so they hold for
                        any caller and not only for one arriving over HTTP.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: |
                        Another Guardian of this environment already carries that name. Names are
                        compared without regard to case, so `Credential leakage` and
                        `credential leakage` are the same name here.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /organizations/{orgId}/environments/{envId}/guardians/_guardrails:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
        get:
            tags:
                - Guardians
            summary: List the guardrails a Guardian can run
            description: |
                The installed policies a Guardian of `apiType` and `phase` can run as guardrails,
                sorted by name. A policy is listed when it is a guardrail and its plugin declares
                `phase` for `apiType`: the same rule the creation and the update apply to the
                guardrail sequence, so a listed guardrail is never refused for its API type or phase.
                An API type no Guardian can be created for lists nothing.

                The configuration schema of a guardrail is served by the plugin endpoints, under its
                `id`.
            operationId: listGuardrails
            parameters:
                - name: apiType
                  in: query
                  required: true
                  description: The API type of the Guardian, as `apiTypes` carries it.
                  schema:
                      $ref: "#/components/schemas/ApiType"
                - name: phase
                  in: query
                  required: true
                  schema:
                      $ref: "#/components/schemas/GuardianPhase"
            responses:
                "200":
                    description: The guardrails, possibly none.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Guardrail"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /organizations/{orgId}/environments/{envId}/guardians/{guardianId}:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
            - $ref: "#/components/parameters/guardianIdParam"
        get:
            tags:
                - Guardians
            summary: Get a Guardian
            operationId: getGuardian
            responses:
                "200":
                    description: The Guardian.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Guardian"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            tags:
                - Guardians
            summary: Replace the definition of a Guardian
            description: |
                Carries the whole definition: the name, the phase, the API types, the guardrail
                sequence and the resources.

                **A `PUT` replaces, it does not patch.** A property the payload omits is left out of
                the stored definition too, so a client that edits one setting sends back everything
                it read — sending only `name` answers 400, because `phase` and `apiTypes` are
                required.

                **The response of `GET /guardians/{guardianId}` is a valid body here.** The fields only
                the store owns — `id`, `lifecycleState`, `deployedAt`, `createdAt`, `updatedAt` — are
                read and dropped, so a client need not strip them. They cannot be set this way: the id
                comes from the path, the lifecycle and the deployment stamp belong to a deployment, and
                the timestamps are the store's.
            operationId: updateGuardian
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateGuardian"
            responses:
                "200":
                    description: The Guardian as updated.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Guardian"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "409":
                    description: |
                        Another Guardian of this environment already carries that name. Names are
                        compared without regard to case, so `Credential leakage` and
                        `credential leakage` are the same name here.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            tags:
                - Guardians
            summary: Delete a Guardian
            description: |
                Refuses deletion with 409 while the Guardian has an active publication, whether its
                draft is DEPLOYED or PENDING. Deleting an unpublished draft does not withdraw an event.
                The PRD's rule — refusing to delete a Guardian that is enabled
                on an API, with the list of those APIs — is **not implemented yet**: the association
                between an API and a Guardian lands with AIAM-1533, so there is nothing to look it
                up in.
            operationId: deleteGuardian
            responses:
                "204":
                    description: Deleted. The body is empty.
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: The Guardian has an active publication and cannot be deleted.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /organizations/{orgId}/environments/{envId}/guardians/{guardianId}/_deploy:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
            - $ref: "#/components/parameters/guardianIdParam"
        post:
            tags:
                - Guardians
            summary: Publish the current Guardian draft to the gateways
            description: |
                Requires ENVIRONMENT_GUARDIAN UPDATE. Publishes a new revision, including when the
                definition is unchanged, and records an audit entry. The returned state compares the
                current draft with the latest publication; it is not an acknowledgement from each gateway.
                The stored draft is published as is: it was validated when created or updated, so a policy
                that has become incompatible since, uninstalled or downgraded, is only refused when the
                gateways start the Guardian.
            operationId: deployGuardian
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/DeployGuardian"
            responses:
                "200":
                    description: The Guardian with its current publication state and deployment date.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Guardian"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    /organizations/{orgId}/environments/{envId}/guardians/{guardianId}/_undeploy:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
            - $ref: "#/components/parameters/guardianIdParam"
        post:
            tags:
                - Guardians
            summary: Withdraw the Guardian publication from the gateways
            description: |
                Requires ENVIRONMENT_GUARDIAN UPDATE. Withdraws the active publication and records
                an audit entry, preserving the current draft and the last deployment date. Updates
                updatedAt when a publication is withdrawn. Already undeployed Guardians are returned
                unchanged without another event or audit entry. The returned UNDEPLOYED state is
                not an acknowledgement from each gateway.
            operationId: undeployGuardian
            responses:
                "200":
                    description: The Guardian with no active publication and its last deployment date.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Guardian"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

components:
    securitySchemes:
        CookieAuth:
            type: apiKey
            in: cookie
            name: GAMMA-SESSION
            description: |
                Gamma-host session cookie set by the parent rest-api login flow. The same scheme
                used by every other gamma endpoint.

    parameters:
        orgIdParam:
            name: orgId
            in: path
            required: true
            description: Id of an organization.
            schema:
                type: string
                default: DEFAULT
        envIdParam:
            name: envId
            in: path
            required: true
            description: |
                Id or hrid of an environment. The host resolves and validates it against the
                organization, so a mismatch is refused before any Guardian is read.
            schema:
                type: string
                default: DEFAULT
        guardianIdParam:
            name: guardianId
            in: path
            required: true
            description: Id of a Guardian.
            schema:
                type: string
                maxLength: 64

    responses:
        BadRequest:
            description: The request is not acceptable.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Forbidden:
            description: |
                The caller lacks the `ENVIRONMENT_GUARDIAN` permission for the action this verb
                needs.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        NotFound:
            description: |
                No Guardian with this id **in this environment**. One that exists in another
                environment answers the same way, on purpose: the response does not distinguish
                "absent" from "not yours".
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"

    schemas:
        Guardian:
            type: object
            description: A Guardian as this surface serves it.
            properties:
                id:
                    type: string
                    maxLength: 64
                name:
                    type: string
                    maxLength: 512
                description:
                    type: string
                    maxLength: 1024
                    description: |
                        Free text the console shows beside the name. Control-plane only: the gateway
                        never reads it, so it is not part of the definition.
                phase:
                    $ref: "#/components/schemas/GuardianPhase"
                apiTypes:
                    $ref: "#/components/schemas/ApiTypes"
                policies:
                    $ref: "#/components/schemas/Policies"
                resources:
                    $ref: "#/components/schemas/Resources"
                lifecycleState:
                    $ref: "#/components/schemas/GuardianLifecycleState"
                deployedAt:
                    $ref: "#/components/schemas/Timestamp"
                createdAt:
                    $ref: "#/components/schemas/Timestamp"
                updatedAt:
                    $ref: "#/components/schemas/Timestamp"
            required:
                - id
                - name
                - phase
                - apiTypes
                - lifecycleState
                - createdAt
                - updatedAt
            example:
                id: cd7e491c-5398-483d-b24e-208d6ac197f1
                name: Credential leakage guard
                description: Blocks a reply that echoes an API key.
                phase: RESPONSE
                apiTypes:
                    - llm-proxy
                policies:
                    - name: Mask credentials
                      policy: data-logging-masking
                      enabled: true
                lifecycleState: UNDEPLOYED
                createdAt: "2026-11-07T10:00:01.119Z"
                updatedAt: "2026-11-07T10:00:01.119Z"

        GuardianSummary:
            type: object
            description: |
                One row of the Guardian list: what a list screen shows, and nothing it does not.

                The guardrail sequence (`policies`) and the `resources` are deliberately absent —
                they are the bulk of a Guardian, and a page of twenty would carry twenty copies of
                them for columns that never render one. Read `GET /guardians/{guardianId}` for the
                whole definition.

                `guardrailCount` stands in for the one thing a row says about the sequence: its
                length.
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                phase:
                    $ref: "#/components/schemas/GuardianPhase"
                apiTypes:
                    $ref: "#/components/schemas/ApiTypes"
                lifecycleState:
                    $ref: "#/components/schemas/GuardianLifecycleState"
                guardrailCount:
                    type: integer
                    format: int32
                    description: How many guardrails the sequence holds.
                createdAt:
                    $ref: "#/components/schemas/Timestamp"
                updatedAt:
                    $ref: "#/components/schemas/Timestamp"
            required:
                - id
                - name
                - phase
                - apiTypes
                - lifecycleState
                - guardrailCount
                - createdAt
                - updatedAt
            example:
                id: cd7e491c-5398-483d-b24e-208d6ac197f1
                name: Credential leakage guard
                description: Blocks a reply that echoes an API key.
                phase: RESPONSE
                apiTypes:
                    - llm-proxy
                lifecycleState: UNDEPLOYED
                guardrailCount: 1
                createdAt: "2026-11-07T10:00:01.119Z"
                updatedAt: "2026-11-07T10:00:01.119Z"

        CreateGuardian:
            type: object
            description: |
                The whole Guardian definition, guardrail sequence included. Rejects any key it does
                not declare, rather than ignoring it — an unknown property answers 400.

                The environment is not a property: it comes from the path. Neither is `deployedAt`,
                which only a deployment may write.
            additionalProperties: false
            properties:
                id:
                    type: string
                    format: uuid
                    description: |
                        Optional, and a UUID when given — anything else answers 400. Omit it and the
                        server generates one. An id already in use is refused with 400.
                name:
                    type: string
                    maxLength: 512
                description:
                    type: string
                    maxLength: 1024
                    description: |
                        Free text the console shows beside the name. Control-plane only: the gateway
                        never reads it, so it is not part of the definition.
                phase:
                    $ref: "#/components/schemas/GuardianPhase"
                apiTypes:
                    $ref: "#/components/schemas/ApiTypes"
                policies:
                    $ref: "#/components/schemas/Policies"
                resources:
                    $ref: "#/components/schemas/Resources"
            required:
                - name
                - phase
                - apiTypes
            example:
                name: Credential leakage guard
                description: Blocks a reply that echoes an API key.
                phase: RESPONSE
                apiTypes:
                    - llm-proxy
                policies:
                    - name: Mask credentials
                      policy: data-logging-masking
                      enabled: true

        UpdateGuardian:
            type: object
            description: |
                The whole definition again: a `PUT` replaces, it does not patch. A property this body
                leaves out is left out of the stored definition too, so a client that edits one
                setting sends back everything it read.

                `id` is accepted only to be ignored: the path owns the identity, so a value in the body
                is never applied and never has to be stripped.

                Rejects any key it does not declare. The five `readOnly` properties below are
                declared for exactly that reason: they are what a `GET` returns and only the store
                writes them, so they are accepted here and ignored rather than refused, and the
                response of a `GET` can be sent straight back.
            additionalProperties: false
            properties:
                id:
                    type: string
                    readOnly: true
                    description: Ignored — the path owns the identity.
                lifecycleState:
                    allOf:
                        - $ref: "#/components/schemas/GuardianLifecycleState"
                    readOnly: true
                    description: Ignored — derived from the latest deployment.
                deployedAt:
                    allOf:
                        - $ref: "#/components/schemas/Timestamp"
                    readOnly: true
                    description: Ignored — the date of the latest deployment.
                createdAt:
                    allOf:
                        - $ref: "#/components/schemas/Timestamp"
                    readOnly: true
                    description: Ignored — the store owns it.
                updatedAt:
                    allOf:
                        - $ref: "#/components/schemas/Timestamp"
                    readOnly: true
                    description: Ignored — the store owns it.
                name:
                    type: string
                    maxLength: 512
                description:
                    type: string
                    maxLength: 1024
                    description: |
                        Free text the console shows beside the name. Control-plane only: the gateway
                        never reads it, so it is not part of the definition.
                phase:
                    $ref: "#/components/schemas/GuardianPhase"
                apiTypes:
                    $ref: "#/components/schemas/ApiTypes"
                policies:
                    $ref: "#/components/schemas/Policies"
                resources:
                    $ref: "#/components/schemas/Resources"
            required:
                - name
                - phase
                - apiTypes
            example:
                name: Credential leakage guard v2
                description: Blocks a reply that echoes an API key, v2.
                phase: RESPONSE
                apiTypes:
                    - llm-proxy
                policies: []

        GuardiansResponse:
            type: object
            description: |
                The `{ data, pagination }` envelope the rest of this surface uses. 1-based `page`.
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/GuardianSummary"
                pagination:
                    $ref: "#/components/schemas/Pagination"
            required:
                - data
                - pagination

        Pagination:
            type: object
            properties:
                totalCount:
                    type: integer
                    format: int64
                    description: Guardians matching the query across every page.
                page:
                    type: integer
                    description: 1-based number of the page served.
                perPage:
                    type: integer
                    description: |
                        The page size actually served, which is the default or the cap when the
                        request asked for neither a valid size nor none. Not the number of rows
                        this page holds — that is `pageItemsCount`.
                pageCount:
                    type: integer
                    description: Pages needed for `totalCount` at `perPage` rows each.
                pageItemsCount:
                    type: integer
                    description: Rows in `data`. Smaller than `perPage` on the last page.
            required:
                - totalCount
                - page
                - perPage
                - pageCount
                - pageItemsCount

        ApiType:
            type: string
            description: |
                The kind of API a Guardian is designed for, spelled as the label the rest of APIM
                uses — `llm-proxy`, not `LLM_PROXY`. **Creation accepts `llm-proxy` only** in 4.14;
                the other values can be read but not written here.
            enum:
                - a2a-proxy
                - authz
                - edge
                - llm-proxy
                - mcp-proxy
                - message
                - native
                - proxy
            example: llm-proxy

        ApiTypes:
            type: array
            description: |
                The API types this Guardian is designed for. **In 4.14 the only accepted value is
                `llm-proxy`**, and the list may not be empty: the gateway runs a Guardian on nothing
                else, so storing another type would store a Guardian nothing can execute.
            minItems: 1
            items:
                $ref: "#/components/schemas/ApiType"
            example:
                - llm-proxy

        Policies:
            type: array
            description: |
                The guardrail sequence, in order. Each entry is a v4 definition-model `Step` — the
                same shape a flow uses, carrying at least `policy`, plus `name`, `description`,
                `configuration`, `condition` and `enabled`. Not enumerated here: the shape belongs to
                `gravitee-apim-definition`, and restating it would let the two drift apart.
            items:
                type: object
                additionalProperties: true
            example:
                - name: Mask credentials
                  policy: data-logging-masking
                  enabled: true

        Resources:
            type: array
            description: |
                The resources the guardrails need, as v4 definition-model `Resource` entries. Same
                reasoning as `policies`: the shape lives in the definition model.
            items:
                type: object
                additionalProperties: true
            example: []

        GuardianPhase:
            type: string
            description: |
                When the guardrail sequence runs. Chosen at creation and sent again on every update,
                because a `PUT` replaces the whole definition.
            enum:
                - REQUEST
                - RESPONSE

        Guardrail:
            type: object
            description: An installed policy a Guardian can run as one of its guardrails.
            properties:
                id:
                    type: string
                    description: The policy plugin id, the value a guardrail step carries in `policy`.
                name:
                    type: string
                    description: The plugin name, for display.
            required:
                - id
                - name
            example:
                id: data-logging-masking
                name: Data logging masking

        DeployGuardian:
            type: object
            additionalProperties: false
            properties:
                deploymentLabel:
                    type: string
                    maxLength: 256
                    description: Optional label retained with this deployment in the event history.

        GuardianLifecycleState:
            type: string
            description: |
                Whether the current draft matches its latest publication. UNDEPLOYED means no active
                publication, DEPLOYED means the draft matches it, and PENDING means it differs.
                This is not an acknowledgement that every gateway has started the revision.
                A newly created Guardian is UNDEPLOYED.
            enum:
                - DEPLOYED
                - UNDEPLOYED
                - PENDING

        Timestamp:
            type: string
            format: date-time
            description: |
                An instant as an ISO 8601 string in UTC, so the offset does not depend on the server's
                time zone.
            example: "2026-11-07T10:00:01.119Z"

        Error:
            type: object
            description: |
                The error body of this surface. It carries a human-readable message and the status,
                and **no technical code** — do not write a client against one.
            properties:
                message:
                    type: string
                http_status:
                    type: integer
            required:
                - message
                - http_status
            example:
                message: "Guardian 'nope' not found"
                http_status: 404
