openapi: 3.0.3
info:
    title: Gravitee.io Gamma - Credentials
    description: |
        Credentials of an environment, which any Gamma module can use to call an external service: an LLM provider,
        an MCP server, a SaaS API.

        **A response never carries a secret value.** A credential holds a reference per secret field. Give
        `references` to secrets that already exist, or `values` for Gravitee to store as secrets; the response
        then returns references into the Gravitee secret store and `managed: true`.

        **Nothing here is generated.** The gamma rest-api has no OpenAPI generator wired, so the request and
        response bodies are hand-written Java records and this file is documentation kept in step with them by
        hand. If the two ever disagree, the records are the truth.

        **Timestamps are ISO 8601 strings in UTC**, such as `"2026-11-13T10:00:01.119Z"`.
    contact:
        email: team-apim@graviteesource.com
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    version: 1.0.0

security:
    - CookieAuth: []

servers:
    - url: "/gamma"
      description: Gravitee.io Gamma host application

tags:
    - name: Credentials
      description: |
          Every operation requires the `ENVIRONMENT_CREDENTIAL` permission with the action matching the verb.
          Anyone with READ reads every credential of the environment. Only the owner of a credential or an
          administrator can update, rotate or delete it.

paths:
    /organizations/{orgId}/environments/{envId}/credentials:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
        post:
            tags:
                - Credentials
            summary: Create a credential
            description: |
                Values also need `ENVIRONMENT_SECRET[CREATE]`, and a reference into the Gravitee secret store needs
                `ENVIRONMENT_SECRET[READ]`.
            operationId: createCredential
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateCredential"
            responses:
                "201":
                    description: Credential created. `Location` points at it.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Credential"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
        get:
            tags:
                - Credentials
            summary: List the credentials of the environment
            description: Sorted by name.
            operationId: listCredentials
            parameters:
                - name: q
                  in: query
                  required: false
                  description: Text the name contains, ignoring case.
                  schema:
                      type: string
                - name: strategy
                  in: query
                  required: false
                  description: Keep the credentials of these strategies, comma-separated (`?strategy=BEARER,API_KEY`) or repeated.
                  explode: false
                  schema:
                      type: array
                      items:
                          $ref: "#/components/schemas/CredentialStrategy"
                - name: serviceId
                  in: query
                  required: false
                  description: Keep the credentials of this service.
                  schema:
                      type: string
                - name: page
                  in: query
                  required: false
                  description: 1-based page number.
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                - name: perPage
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
            responses:
                "200":
                    description: A page of credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CredentialsResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /organizations/{orgId}/environments/{envId}/credentials/{credentialId}:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
            - $ref: "#/components/parameters/credentialIdParam"
        get:
            tags:
                - Credentials
            summary: Get a credential
            operationId: getCredential
            responses:
                "200":
                    description: The credential.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Credential"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
        put:
            tags:
                - Credentials
            summary: Update a credential
            description: |
                Replaces the details of a credential. Its id, strategy and secret values do not change: rotate the
                values instead.
            operationId: updateCredential
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateCredential"
            responses:
                "200":
                    description: The updated credential.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Credential"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
        delete:
            tags:
                - Credentials
            summary: Delete a credential
            description: |
                Deletes the credential and the secrets Gravitee stores for it, which also needs
                `ENVIRONMENT_SECRET[DELETE]`.
            operationId: deleteCredential
            responses:
                "204":
                    description: Credential deleted.
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: A Gamma module still uses the credential.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"

    /organizations/{orgId}/environments/{envId}/credentials/{credentialId}/_rotate:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
            - $ref: "#/components/parameters/credentialIdParam"
        post:
            tags:
                - Credentials
            summary: Rotate the values of a credential
            description: |
                Replaces some or all of the values Gravitee stores for a credential. The references do not change.
                Also needs `ENVIRONMENT_SECRET[UPDATE]`.
            operationId: rotateCredential
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RotateCredential"
            responses:
                "200":
                    description: The rotated credential.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Credential"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

    /organizations/{orgId}/environments/{envId}/credentials/{credentialId}/consumers:
        parameters:
            - $ref: "#/components/parameters/orgIdParam"
            - $ref: "#/components/parameters/envIdParam"
            - $ref: "#/components/parameters/credentialIdParam"
        get:
            tags:
                - Credentials
            summary: List the consumers of a credential
            description: The objects of the Gamma modules that use the credential.
            operationId: listCredentialConsumers
            responses:
                "200":
                    description: The consumers of the credential.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: "#/components/schemas/CredentialConsumer"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"

components:
    securitySchemes:
        CookieAuth:
            type: apiKey
            in: cookie
            name: GAMMA-SESSION
            description: Gamma-host session cookie set by the parent rest-api login flow.

    parameters:
        orgIdParam:
            name: orgId
            in: path
            required: true
            description: Id of an organization.
            schema:
                type: string
                default: DEFAULT
        envIdParam:
            name: envId
            in: path
            required: true
            description: Id or hrid of an environment.
            schema:
                type: string
                default: DEFAULT
        credentialIdParam:
            name: credentialId
            in: path
            required: true
            description: Id of a credential.
            schema:
                type: string

    responses:
        BadRequest:
            description: The request is not acceptable.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        Forbidden:
            description: The caller lacks a permission the operation needs, or does not own the credential.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"
        NotFound:
            description: No credential with this id in this environment.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/Error"

    schemas:
        CredentialStrategy:
            type: string
            description: How a consumer authenticates with the credential, which decides its secret fields and settings.
            enum:
                - BEARER
                - API_KEY
                - OAUTH2
                - BASIC
                - SERVICE_ACCOUNT
        CreateCredential:
            type: object
            additionalProperties: false
            required:
                - name
                - strategy
            properties:
                name:
                    type: string
                    maxLength: 256
                strategy:
                    $ref: "#/components/schemas/CredentialStrategy"
                serviceId:
                    type: string
                    maxLength: 256
                    description: The service the credential calls, to find it by.
                ownerId:
                    type: string
                    description: A user of the organization. Defaults to the user who creates it.
                expiresAt:
                    $ref: "#/components/schemas/Instant"
                configuration:
                    type: object
                    description: |
                        The settings that are not secret. API_KEY takes `headerName`; OAUTH2 takes `tokenUrl`, `scopes`
                        and `audience`.
                    additionalProperties: true
                references:
                    type: object
                    description: For each secret field, a reference to a secret that already exists.
                    additionalProperties:
                        type: string
                values:
                    type: object
                    description: For each secret field, a value for Gravitee to store as a secret.
                    writeOnly: true
                    additionalProperties:
                        type: string
        UpdateCredential:
            type: object
            additionalProperties: false
            required:
                - name
            properties:
                name:
                    type: string
                    maxLength: 256
                serviceId:
                    type: string
                    maxLength: 256
                ownerId:
                    type: string
                    description: Leave it out to keep the current owner.
                expiresAt:
                    $ref: "#/components/schemas/Instant"
                configuration:
                    type: object
                    additionalProperties: true
                references:
                    type: object
                    description: Leave it out, or send back the references read, to keep them.
                    additionalProperties:
                        type: string
        RotateCredential:
            type: object
            additionalProperties: false
            required:
                - values
            properties:
                values:
                    type: object
                    description: The new value of each secret field to rotate.
                    writeOnly: true
                    additionalProperties:
                        type: string
        CredentialSecretReference:
            type: object
            properties:
                reference:
                    type: string
                    example: /gravitee/credential.7f3c.token:value?renewable=true&reloadOnChange=true
                managed:
                    type: boolean
                    description: Whether Gravitee stores the value behind the reference.
        Credential:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                strategy:
                    $ref: "#/components/schemas/CredentialStrategy"
                serviceId:
                    type: string
                ownerId:
                    type: string
                expiresAt:
                    $ref: "#/components/schemas/Instant"
                configuration:
                    type: object
                    additionalProperties: true
                secretReferences:
                    type: object
                    additionalProperties:
                        $ref: "#/components/schemas/CredentialSecretReference"
                managed:
                    type: boolean
                    description: Whether Gravitee stores the values of the credential.
                createdAt:
                    $ref: "#/components/schemas/Instant"
                updatedAt:
                    $ref: "#/components/schemas/Instant"
                rotatedAt:
                    $ref: "#/components/schemas/Instant"
        CredentialConsumer:
            type: object
            properties:
                module:
                    type: string
                    example: aim
                type:
                    type: string
                    example: LLM_PROXY
                id:
                    type: string
                name:
                    type: string
        CredentialsResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/Credential"
                pagination:
                    $ref: "#/components/schemas/Pagination"
        Pagination:
            type: object
            properties:
                totalCount:
                    type: integer
                    format: int64
                page:
                    type: integer
                perPage:
                    type: integer
                pageCount:
                    type: integer
                pageItemsCount:
                    type: integer
        Instant:
            type: string
            format: date-time
            description: An instant as an ISO 8601 string in UTC.
            example: "2026-11-13T10:00:01.119Z"
        Error:
            type: object
            properties:
                message:
                    type: string
                http_status:
                    type: integer
            required:
                - message
                - http_status
