<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Loading...</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="webcomponents/webcomponents-loader.js"></script>
    <script src="redoc/redoc.standalone.js"></script>
    <style>
      #gravitee-bootstrap-error {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: sans-serif;
      }

      .index__bootstrap-error-banner {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        max-width: 480px;
        padding: 12px 16px;
        border: 3px solid #fe733f;
        color: #2c0c01;
      }
    </style>
  </head>
  <body>
    <span id="loader" class="loader"></span>
    <div id="gravitee-bootstrap-error" role="alert">
      <div class="index__bootstrap-error-banner">
        <span>Portal API unreachable or error occurs, please check logs</span>
        <button id="gravitee-bootstrap-error-retry" type="button">Retry</button>
      </div>
    </div>
    <app-root></app-root>
  </body>
</html>
