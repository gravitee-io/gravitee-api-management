version: '3'

env:
  DOCKER_REGISTRY: '{{.DOCKER_REGISTRY | default "graviteeio.azurecr.io"}}'
  DOCKER_TAG: '{{.DOCKER_TAG | default "local"}}'

tasks:
  # The distribution is a reactor of its own and assembles a released engine by default. Anything
  # that has to run YOUR engine therefore takes two steps: install it, then assemble against it with
  # the engine-snapshot profile. These tasks do that in order — prefer them over calling mvn by hand,
  # or you will quietly assemble the released engine and wonder where your changes went.

  build-quick:
    desc: "Build management-api & gateway quickly without running tests & validations steps"
    cmds:
      - task: build-engine
      - task: build-distribution

  build-engine:
    desc: "Build the engine and install it into your local repository"
    cmds:
      - mvn clean install -DskipTests -Dskip.validation -T 1C

  build-distribution:
    desc: "Assemble the distribution against the engine currently installed locally"
    cmds:
      # -nsu: do not go looking for a newer snapshot upstream. You have just built the engine; a
      # published snapshot must not silently take its place.
      - mvn -f gravitee-apim-distribution/pom.xml clean install -Pengine-snapshot -nsu -DskipTests -Dskip.validation -Dbundle=dev -T 1C
      - task: which-engine

  which-engine:
    desc: "Show which engine version the assembled distributions actually contain"
    silent: true
    cmds:
      # Worth a look when something behaves unexpectedly: if this does not show the version you are
      # working on, you are running someone else's engine — see build-engine.
      - |
        for c in gateway rest-api; do
          lib="gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-$c/target/distribution/lib"
          jar=$(ls "$lib" 2>/dev/null | grep -m1 -- "-standalone-bootstrap-" || echo "not assembled")
          echo "  $c engine -> $jar"
        done

  integration-test:
    desc: "Run all tests in gravitee-apim-distribution/gravitee-apim-distribution-integration-tests"
    env:
      JDK_JAVA_OPTIONS: -XX:+MaxFDLimit
    cmds:
      # Installing the engine first is what makes these tests exercise your working tree: with the
      # engine-snapshot profile and nothing installed, Maven would happily pull the published snapshot.
      - task: build-engine
      - mvn -f gravitee-apim-distribution/pom.xml -T2C -nsu -pl gravitee-apim-distribution-integration-tests -am clean install -Pengine-snapshot,integration-tests-modules -Dskip.validation=true -DskipTests -Dbundle=dev -Dmaven.test.skip
      - ulimit -n 102400
      - mvn -f gravitee-apim-distribution/pom.xml -fae -nsu -pl gravitee-apim-distribution-integration-tests install -Pengine-snapshot,integration-tests-modules -Dbundle=dev

  docker:
    desc: "Build all 🐳 images"
    cmds:
      - task: docker-backend
      - task: docker-ui

  docker-backend:
    desc: "Build backend 🐳 images"
    cmds:
      - docker build -t ${DOCKER_REGISTRY}/apim-gateway:$DOCKER_TAG -f gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-gateway/docker/Dockerfile ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-gateway/target
      - docker build -t ${DOCKER_REGISTRY}/apim-management-api:$DOCKER_TAG -f gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-rest-api/docker/Dockerfile ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-rest-api/target

  docker-ui:
    desc: "Build UI 🐳 images"
    cmds:
      - docker build -t ${DOCKER_REGISTRY}/apim-management-ui:$DOCKER_TAG -f gravitee-apim-console-webui/docker/Dockerfile ./gravitee-apim-console-webui
      - docker build -t ${DOCKER_REGISTRY}/apim-portal-ui:$DOCKER_TAG -f gravitee-apim-portal-webui/docker/Dockerfile ./gravitee-apim-portal-webui
      - docker build -t ${DOCKER_REGISTRY}/gamma-ui:$DOCKER_TAG -f gravitee-gamma/gravitee-gamma-control-plane-webui/docker/Dockerfile ./gravitee-gamma/gravitee-gamma-control-plane-webui

  postgres-driver:
    desc: "Download postgres jdbc driver"
    cmds:
      - curl https://jdbc.postgresql.org/download/postgresql-42.4.0.jar --create-dirs -o /tmp/postgresql-42.4.0.jar
      - cp /tmp/postgresql-42.4.0.jar $APIM_GW_DISTRIBUTION_PATH/plugins/ext/repository-jdbc
      - cp /tmp/postgresql-42.4.0.jar $APIM_MAPI_DISTRIBUTION_PATH/plugins/ext/repository-jdbc
