databaseChangeLog:
  - changeSet:
      id: 4.14.0_15_create_api_guardians_table
      author: GraviteeSource Team
      changes:
        - createTable:
            tableName: ${gravitee_prefix}api_guardians
            columns:
              - column:
                  name: api_id
                  type: nvarchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_${gravitee_prefix}api_guardians
              - column:
                  name: guardian_id
                  type: nvarchar(64)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_${gravitee_prefix}api_guardians
        - createIndex:
            indexName: idx_${gravitee_prefix}api_guardians_guardian_id
            tableName: ${gravitee_prefix}api_guardians
            columns:
              - column:
                  name: guardian_id
