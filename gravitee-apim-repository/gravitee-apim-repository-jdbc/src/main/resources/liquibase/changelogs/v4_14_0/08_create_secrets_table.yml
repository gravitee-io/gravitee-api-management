databaseChangeLog:
  - changeSet:
      id: 4.14.0_08_create_secrets_table
      author: GraviteeSource Team
      changes:
        - createTable:
            tableName: ${gravitee_prefix}secrets
            columns:
              - column: {name: id, type: nvarchar(64), constraints: { nullable: false, primaryKey: true, primaryKeyName: "pk_${gravitee_prefix}secrets" } }
              - column: {name: organization_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: {name: environment_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: {name: key, type: nvarchar(128), constraints: { nullable: false } }
              # Hex SHA-256 of key, written by the repository, so uniqueness is case-sensitive on every database.
              - column: {name: key_hash, type: nvarchar(64), constraints: { nullable: false } }
              - column: {name: encrypted_value, type: nclob, constraints: { nullable: false } }
              - column: {name: created_at, type: timestamp(6), constraints: { nullable: false } }
              - column: {name: updated_at, type: timestamp(6), constraints: { nullable: false } }
        - addUniqueConstraint:
            constraintName: uk_${gravitee_prefix}secrets_env_key_hash
            tableName: ${gravitee_prefix}secrets
            columnNames: environment_id, key_hash
