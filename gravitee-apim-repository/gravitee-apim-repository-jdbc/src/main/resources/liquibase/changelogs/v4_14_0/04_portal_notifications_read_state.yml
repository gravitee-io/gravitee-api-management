databaseChangeLog:
  - changeSet:
      id: 4.14.0_04_portal_notifications_read_state
      author: GraviteeSource Team
      changes:
        - addColumn:
            tableName: ${gravitee_prefix}portal_notifications
            columns:
              - column: {name: read_at, type: timestamp(6), constraints: { nullable: true } }
              - column: {name: hook, type: nvarchar(64), constraints: { nullable: true } }
              - column: {name: api_id, type: nvarchar(64), constraints: { nullable: true } }
              - column: {name: application_id, type: nvarchar(64), constraints: { nullable: true } }
              - column: {name: environment_id, type: nvarchar(64), constraints: { nullable: true } }
        - createIndex:
            indexName: idx_${gravitee_prefix}portal_notifications_user_env_read_created
            tableName: ${gravitee_prefix}portal_notifications
            columns:
              - column:
                  name: user
              - column:
                  name: environment_id
              - column:
                  name: read_at
              - column:
                  name: created_at
