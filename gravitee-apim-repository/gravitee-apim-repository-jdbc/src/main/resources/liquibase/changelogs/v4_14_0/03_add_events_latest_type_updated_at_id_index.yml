databaseChangeLog:
  - changeSet:
      id: 4.14.0_03_add_events_latest_type_updated_at_id_index
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_${gravitee_prefix}events_latest_type_updatedat_id
                tableName: ${gravitee_prefix}events_latest
      changes:
        - createIndex:
            indexName: idx_${gravitee_prefix}events_latest_type_updatedat_id
            columns:
              - column: {name: type, type: nvarchar(64)}
              - column: {name: updated_at, type: timestamp(6)}
              - column: {name: id, type: nvarchar(64)}
            tableName: ${gravitee_prefix}events_latest
