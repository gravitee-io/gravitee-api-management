databaseChangeLog:
  - changeSet:
      id: 4.14.0_14_create_credentials_table
      author: GraviteeSource Team
      changes:
        - createTable:
            tableName: ${gravitee_prefix}credentials
            columns:
              - column: {name: id, type: nvarchar(64), constraints: { nullable: false, primaryKey: true, primaryKeyName: "pk_${gravitee_prefix}credentials" } }
              - column: {name: organization_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: {name: environment_id, type: nvarchar(64), constraints: { nullable: false } }
              - column: {name: name, type: nvarchar(256), constraints: { nullable: false } }
              - column: {name: strategy, type: nvarchar(32), constraints: { nullable: false } }
              - column: {name: service_id, type: nvarchar(256), constraints: { nullable: true } }
              - column: {name: owner_id, type: nvarchar(64), constraints: { nullable: true } }
              - column: {name: expires_at, type: timestamp(6), constraints: { nullable: true } }
              - column: {name: configuration, type: nclob, constraints: { nullable: false } }
              - column: {name: secret_references, type: nclob, constraints: { nullable: false } }
              - column: {name: created_at, type: timestamp(6), constraints: { nullable: false } }
              - column: {name: updated_at, type: timestamp(6), constraints: { nullable: false } }
              - column: {name: rotated_at, type: timestamp(6), constraints: { nullable: true } }
        - createIndex:
            tableName: ${gravitee_prefix}credentials
            indexName: idx_${gravitee_prefix}credentials_environment_id_name
            columns:
              - column:
                  name: environment_id
                  type: nvarchar(64)
              - column:
                  name: name
                  type: nvarchar(256)
