databaseChangeLog:
  - changeSet:
      id: 4.14.0_12_add_secrets_organization_id_index
      author: GraviteeSource Team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_${gravitee_prefix}secrets_organization_id
                tableName: ${gravitee_prefix}secrets
      changes:
        - createIndex:
            indexName: idx_${gravitee_prefix}secrets_organization_id
            columns:
              - column: {name: organization_id, type: nvarchar(64)}
            tableName: ${gravitee_prefix}secrets
