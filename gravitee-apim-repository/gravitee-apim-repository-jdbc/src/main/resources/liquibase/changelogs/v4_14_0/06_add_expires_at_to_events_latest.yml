databaseChangeLog:
  - changeSet:
      id: 4.14.0_06_add_expires_at_to_events_latest
      author: GraviteeSource Team
      changes:
        - addColumn:
            tableName: ${gravitee_prefix}events_latest
            columns:
              - column: {name: expires_at, type: timestamp(6), constraints: { nullable: true } }
        - createIndex:
            indexName: idx_${gravitee_prefix}events_latest_type_expiresat
            columns:
              - column: {name: type, type: nvarchar(64)}
              - column: {name: expires_at, type: timestamp(6)}
            tableName: ${gravitee_prefix}events_latest
