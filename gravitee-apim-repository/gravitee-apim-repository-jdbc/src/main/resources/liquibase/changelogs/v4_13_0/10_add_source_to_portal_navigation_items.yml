databaseChangeLog:
  - changeSet:
      id: 4.13.0_10_add_source_to_portal_navigation_items
      author: GraviteeSource Team
      changes:
        - addColumn:
            tableName: ${gravitee_prefix}portal_navigation_items
            columns:
              - column: {name: source_type, type: nvarchar(64), constraints: { nullable: true } }
              - column: {name: source_configuration, type: nclob, constraints: { nullable: true } }
              - column: {name: use_auto_fetch, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: {name: fetch_cron, type: nvarchar(64), constraints: { nullable: true } }
              - column: {name: last_fetched_at, type: timestamp(6), constraints: { nullable: true } }
              - column: {name: last_fetch_error, type: nclob, constraints: { nullable: true } }
