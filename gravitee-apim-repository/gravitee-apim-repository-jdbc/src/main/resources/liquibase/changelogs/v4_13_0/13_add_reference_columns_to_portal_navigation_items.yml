databaseChangeLog:
  - changeSet:
      id: 4.13.0_13_add_reference_columns_to_portal_navigation_items
      author: GraviteeSource Team
      changes:
        - addColumn:
            tableName: ${gravitee_prefix}portal_navigation_items
            columns:
              - column:
                  name: reference_type
                  type: nvarchar(32)
                  defaultValue: PORTAL
                  constraints:
                    nullable: false
              - column:
                  name: reference_id
                  type: nvarchar(64)
                  defaultValue: 00000000-0000-0000-0000-000000000000
                  constraints:
                    nullable: false
