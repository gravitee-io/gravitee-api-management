# APIM on the chainguard-fips images, with an mTLS plan end to end.
# The gateway keystore is PEM on purpose: under BC-FIPS approved-only it is the only
# format that loads, so it is what a FIPS deployment actually runs.

networks:
    fips:
        name: gravitee-fips

volumes:
    data-mongo:
    data-elasticsearch:

services:
    mongodb:
        image: mongo:${MONGODB_VERSION:-7}
        container_name: gio_fips_mongodb
        healthcheck:
            test: mongosh --eval 'db.runCommand({serverStatus:1}).ok' --quiet | grep 1
            interval: 5s
            retries: 20
        volumes:
            - data-mongo:/data/db
        networks:
            - fips

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.17.2}
        container_name: gio_fips_elasticsearch
        environment:
            - http.host=0.0.0.0
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - '9200:9200'
        healthcheck:
            test: curl -s http://localhost:9200/_cluster/health | grep -qE 'green|yellow'
            interval: 5s
            retries: 40
        volumes:
            - data-elasticsearch:/usr/share/elasticsearch/data
        networks:
            - fips

    management_api:
        image: ${APIM_REGISTRY:-graviteeio.azurecr.io}/apim-management-api:${APIM_VERSION:-latest}-chainguard-fips
        container_name: gio_fips_management_api
        depends_on:
            mongodb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./.license:/opt/graviteeio-management-api/license
        environment:
            - gravitee_management_mongodb_uri=mongodb://mongodb:27017/gravitee
            - gravitee_analytics_type=elasticsearch
            - gravitee_analytics_elasticsearch_endpoints_0=http://elasticsearch:9200
        ports:
            - '8083:8083'
        networks:
            - fips

    console:
        image: ${APIM_UI_REGISTRY:-graviteeio}/apim-management-ui:${APIM_VERSION:-latest}-chainguard
        container_name: gio_fips_console
        depends_on:
            - management_api
        environment:
            - MGMT_API_URL=http://localhost:8083/management/
        ports:
            - '8084:8080'
        networks:
            - fips

    gateway:
        image: ${APIM_REGISTRY:-graviteeio.azurecr.io}/apim-gateway:${APIM_VERSION:-latest}-chainguard-fips
        container_name: gio_fips_gateway
        depends_on:
            mongodb:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./.license:/opt/graviteeio-gateway/license
            - ./.certificates:/certificates
        environment:
            - gravitee_management_mongodb_uri=mongodb://mongodb:27017/gravitee
            - gravitee_ratelimit_mongodb_uri=mongodb://mongodb:27017/gravitee
            - gravitee_reporters_elasticsearch_endpoints_0=http://elasticsearch:9200
            - gravitee_http_secured=true
            - gravitee_http_ssl_clientAuth=request
            - gravitee_http_ssl_keystore_type=pem
            - gravitee_http_ssl_keystore_certificates_0_cert=/certificates/server.crt
            - gravitee_http_ssl_keystore_certificates_0_key=/certificates/server.key
        ports:
            - '8082:8082'
        networks:
            - fips
