suite: Test Management API configmap for the OTel traces repository scope
templates:
  - "api/api-configmap.yaml"
tests:
  - it: Default values render otel-traces with type "none" and no elasticsearch block
    template: api/api-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      # The configmap replaces the whole gravitee.yml: without an explicit `type: none` the optional
      # OTEL_TRACES scope loads no repository at all, and the gamma trace explorer fails with a 500
      # instead of falling back to the no-op TracingRepository.
      # Invariant: the scope stays a child of `repositories:`. helm-unittest cannot parse the
      # embedded gravitee.yml, so the indentation inside the block scalar is the proxy for it —
      # an outdented block, which would bring the 500 back, fails here.
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "\n  otel-traces:\n    type: none\n"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "\n  otel-traces:\n    type: none\n    elasticsearch:"

  - it: Empty type falls back to none
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: ""
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "\n  otel-traces:\n    type: none\n"

  - it: Unset type falls back to none
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: null
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "\n  otel-traces:\n    type: none\n"

  - it: Null scope block falls back to none
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces: null
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "\n  otel-traces:\n    type: none\n"

  - it: Type elasticsearch renders the block with endpoints and index template
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: elasticsearch
          elasticsearch:
            index: traces-apim.otel-{orgId}
            endpoints:
              - http://es.example.com:9200
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "otel-traces:\\s+type: elasticsearch"
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "- http://es.example.com:9200"
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "index: traces-apim.otel-\\{orgId\\}"

  - it: Type elasticsearch renders the security block when set
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: elasticsearch
          elasticsearch:
            index: traces-apim.otel-{orgId}
            endpoints:
              - http://es.example.com:9200
            security:
              username: elastic
              password: changeme
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "username: elastic"
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "password: changeme"

  - it: Type elasticsearch renders the SSL keystore block when set
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: elasticsearch
          elasticsearch:
            index: traces-apim.otel-{orgId}
            endpoints:
              - https://es.example.com:9200
            ssl:
              keystore:
                type: jks
                path: /path/to/keystore.jks
                password: kspw
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "type: jks"
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "path: /path/to/keystore.jks"
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "password: kspw"

  - it: Type elasticsearch renders the http timeout when set
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: elasticsearch
          elasticsearch:
            index: traces-apim.otel-{orgId}
            endpoints:
              - http://es.example.com:9200
            http:
              timeout: 30000
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "timeout: 30000"

  - it: Type other than elasticsearch (e.g. tempo) still renders the type line but skips ES-specific config
    template: api/api-configmap.yaml
    set:
      api:
        otelTraces:
          type: tempo
    asserts:
      # The block always renders `otel-traces.type: <value>`; only the elasticsearch type goes through
      # the ES branch. A Tempo-backed impl would add its own block next to the elasticsearch one —
      # this test pins that the structure is type-agnostic, not ES-only.
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "otel-traces:\\s+type: tempo"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "otel-traces:\\s+type: tempo\\s+elasticsearch:"
