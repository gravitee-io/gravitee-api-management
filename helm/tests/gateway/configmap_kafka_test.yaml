suite: Test Management API configmap with tracing enabled
templates:
  - "gateway/gateway-configmap.yaml"
tests:
  - it: Disabled Kafka
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: false
  - it: Enable Kafka and set common values
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingMode: host
          routingHostMode:
            brokerPrefix: fox-
            domainSeparator: "|"
            defaultDomain: gravitee.io
            defaultPort: 42
          apiKey:
            securityMechanisms: SCRAM-SHA-512
          port: 9042
          host: 42.42.42.42
          idleTimeout: 42
          tcpKeepAlive: 42
          instances: 42
          requestTimeout: 42
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              routingMode: host
              routingHostMode:
                brokerPrefix: fox-
                domainSeparator: "|"
                defaultDomain: "gravitee.io"
                defaultPort: 42
              api-key:
                securityMechanisms: SCRAM-SHA-512
              port: 9042
              host: 42.42.42.42
              idleTimeout: 42
              tcpKeepAlive: 42
              instances: 42
              requestTimeout: 42
  - it: Enable Kafka and set pattern values
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingMode: host
          routingHostMode:
            brokerPrefix: "fox-"
            domainSeparator: "|"
            defaultDomain: "gravitee.io"
            defaultPort: 42
            bootstrapDomainPattern: "{apiHost}.mycompany.org"
            brokerDomainPattern: "broker-{brokerId}-{apiHost}.mycompany.org"
            virtualClusterBrokerDomainPattern: "broker{realBrokerId}-c{clusterIndex}-{apiHost}.mycompany.org"
          apiKey:
            securityMechanisms: SCRAM-SHA-512
          port: 9042
          host: 42.42.42.42
          idleTimeout: 42
          tcpKeepAlive: 42
          instances: 42
          requestTimeout: 42
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              routingMode: host
              routingHostMode:
                brokerPrefix: "fox-"
                domainSeparator: "|"
                defaultDomain: "gravitee.io"
                defaultPort: 42
                bootstrapDomainPattern: "{apiHost}.mycompany.org"
                brokerDomainPattern: "broker-{brokerId}-{apiHost}.mycompany.org"
                virtualClusterBrokerDomainPattern: "broker{realBrokerId}-c{clusterIndex}-{apiHost}.mycompany.org"
              api-key:
                securityMechanisms: SCRAM-SHA-512
              port: 9042
              host: 42.42.42.42
              idleTimeout: 42
              tcpKeepAlive: 42
              instances: 42
              requestTimeout: 42
  - it: Enable Kafka and set multiple custom domains
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingMode: host
          routingHostMode:
            domains:
              - kafka.gravitee.io
              - kafka.mycompany.org
            defaultPort: 9092
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              routingMode: host
              routingHostMode:
                domains:
                  - "kafka.gravitee.io"
                  - "kafka.mycompany.org"
                defaultPort: 9092
  - it: Enable Kafka and set ssl values
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          ssl:
            clientAuth: none
            tlsProtocols: TLSv1.2, TLSv1.3
            tlsCiphers: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384, TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384, TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA
            keystore:
              type: jks
              path: /keystore
              certificates:
                - cert: /opt/apim/security/mycompany.org.pem
                  key: /opt/apim/security/mycompany.org.key
              password: password-key
              watch: "false"
              defaultAlias: myAlias
              secret: secret://kubernetes/my-tls-secret
            truststore:
              type: pem
              path: /truststore
              password: password-trust
              watch: "false"
            openssl: true
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              ssl:
                clientAuth: none
                tlsProtocols: TLSv1.2, TLSv1.3
                tlsCiphers: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384, TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384, TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA
                keystore:
                  type: jks
                  path: /keystore
                  certificates:
                    - cert: /opt/apim/security/mycompany.org.pem
                      key: /opt/apim/security/mycompany.org.key
                  password: "password-key"
                  watch: false
                  defaultAlias: myAlias
                  secret: secret://kubernetes/my-tls-secret
                truststore:
                  type: pem
                  path: /truststore
                  password: "password-trust"
                  watch: false
                openssl: true
  - it: Enable Kafka and set tcp probe
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          probe:
            protocol: tcp
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              probe:
                protocol: tcp
  - it: Enable Kafka and set kafka probe with multiline jaas config
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          probe:
            protocol: kafka
            properties:
              bootstrap.servers: "bootstrap-myapi.mycompany.org:9092"
              sasl.jaas.config: >-
                  org.apache.kafka.common.security.plain.PlainLoginModule required
                  username="username"
                  password="password";
              sasl.mechanism: "PLAIN"
              security.protocol: SASL_SSL
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              probe:
                protocol: kafka
                properties:
                  bootstrap.servers: bootstrap-myapi.mycompany.org:9092
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="username" password="password";
                  sasl.mechanism: PLAIN
                  security.protocol: SASL_SSL
  - it: Enable Kafka and set kafka probe with single line jaas config
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          probe:
            protocol: kafka
            properties:
              bootstrap.servers: "bootstrap-myapi.mycompany.org:9092"
              sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"username\" password=\"password\";"
              sasl.mechanism: "PLAIN"
              security.protocol: SASL_SSL
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              probe:
                protocol: kafka
                properties:
                  bootstrap.servers: bootstrap-myapi.mycompany.org:9092
                  sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="username" password="password";
                  sasl.mechanism: PLAIN
                  security.protocol: SASL_SSL

  - it: Enable Kafka and set probe secured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          probe:
            protocol: tcp
            secured: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              secured: false
              probe:
                protocol: tcp
  - it: Enable Kafka and set probe secured only
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          probe:
            secured: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              secured: false
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "\n  probe:"
  - it: Enable Kafka and render probe secured only in port routing mode
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingMode: port
          probe:
            secured: true
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              routingMode: port
              secured: true
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "routingPortMode"
  - it: Enable Kafka and set routing port mode secured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingMode: port
          routingPortMode:
            secured: true
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              routingMode: port
              routingPortMode:
                secured: true
  - it: Enable Kafka and render routing port mode secured false
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingPortMode:
            secured: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "routingPortMode:\\n\\s+secured: false"
  - it: Enable Kafka and leave routing port mode unset by default
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "routingPortMode"
  - it: Enable Kafka and render both routing port mode secured and deprecated secured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          secured: true
          routingPortMode:
            secured: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "routingPortMode:\\n\\s+secured: false"
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "kafka:\\n  enabled: true\\n(  .*\\n)*?  secured: true"
  - it: Enable Kafka and prefer probe secured over deprecated secured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          secured: true
          probe:
            protocol: tcp
            secured: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              secured: false
              probe:
                protocol: tcp
  - it: Enable Kafka and keep deprecated secured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          secured: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              secured: false
  - it: Enable Kafka and set the client connection limit and readiness thresholds
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          requestTimeout: 42
          maxConnections: 5000
          maxConnectionsPerGiB: 2000
          readiness:
            enabled: true
            notReadyPercent: 95
            readyPercent: 85
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              requestTimeout: 42
              maxConnections: 5000
              maxConnectionsPerGiB: 2000
              readiness:
                enabled: true
                notReadyPercent: 95
                readyPercent: 85
  - it: Enable Kafka and render no readiness block when only thresholds are set
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          readiness:
            notReadyPercent: 95
            readyPercent: 85
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "readiness:|notReadyPercent|readyPercent"
  - it: Enable Kafka and render only enabled false when readiness is off with thresholds
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          readiness:
            enabled: false
            notReadyPercent: 95
            readyPercent: 85
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              readiness:
                enabled: false
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "notReadyPercent|readyPercent"
  - it: Enable Kafka and render enabled true with only one readiness threshold
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          readiness:
            enabled: true
            readyPercent: 85
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              readiness:
                enabled: true
                readyPercent: 85
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "notReadyPercent"
  - it: Enable Kafka and render enabled true with no readiness threshold
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          readiness:
            enabled: true
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              readiness:
                enabled: true
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "notReadyPercent|readyPercent"
  - it: Enable Kafka and keep the connection limit and readiness unset by default
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "maxConnections|readiness:|notReadyPercent|readyPercent"
  - it: Enable Kafka and set the backend login pool
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          requestTimeout: 42
          backendLogin:
            threads: 6
            queueCapacity: 100
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              requestTimeout: 42
              backendLogin:
                threads: 6
                queueCapacity: 100
  - it: Enable Kafka and set only the backend login threads
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          backendLogin:
            threads: 6
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            backendLogin:
                threads: 6
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "queueCapacity"
  - it: Enable Kafka and set only the backend login queue capacity
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          backendLogin:
            queueCapacity: 100
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            backendLogin:
                queueCapacity: 100
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "backendLogin:\\s+threads"
  - it: Enable Kafka and keep the backend login pool unset by default
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "backendLogin"
  - it: Enable Kafka and set backend metadata max age and mesh refresh connection reuse
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          requestTimeout: 42
          backendMetadataMaxAge: 30
          mesh:
            refreshConnectionReuse: false
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            kafka:
              enabled: true
              requestTimeout: 42
              backendMetadataMaxAge: 30
              mesh:
                refreshConnectionReuse: false
  - it: Enable Kafka and keep backend metadata max age and mesh unset by default
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "backendMetadataMaxAge|refreshConnectionReuse"
  - it: Render no routing port mode block when it is empty
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          routingPortMode: {}
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "routingPortMode"
