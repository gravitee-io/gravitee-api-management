suite: Test config maps properly sets ES reporter
templates:
  - "gateway/gateway-configmap.yaml"

tests:

  - it: Check that ingest plugins takes default values if not set
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "[ ]+ingest: geoip, user_agent\n"

  - it: Check that ingest plugins are set with given values
    set:
      es:
        pipeline:
          plugins:
            ingest: my-test-ingest-plugin, another-plugin
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "[ ]+ingest: my-test-ingest-plugin, another-plugin\n"

  - it: Check that ingest plugins are set empty, if user want to disable them
    set:
      es:
        pipeline:
          plugins:
            ingest:
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "[ ]+ingest: \n"

  - it: Check default es settings
    template: gateway/gateway-configmap.yaml
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            reporters:
              # Elasticsearch reporter
              elasticsearch:
                endpoints:
                  - http://graviteeio-apim-elasticsearch-ingest-hl:9200
                index_mode: daily
                pipeline:
                  plugins:
                    ingest: geoip, user_agent
                index: gravitee
                settings:
                  number_of_replicas: 1
                  number_of_shards: 1
                  refresh_interval: 5s
                bulk:
                  actions: 1000           # Number of requests action before flush
                  flush_interval: 5       # Flush interval in seconds

  - it: Check override es settings
    template: gateway/gateway-configmap.yaml
    set:
      es:
        settings:
          number_of_shards: 2
          number_of_replicas: 2
          refresh_interval: 10s
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            reporters:
              # Elasticsearch reporter
              elasticsearch:
                endpoints:
                  - http://graviteeio-apim-elasticsearch-ingest-hl:9200
                index_mode: daily
                pipeline:
                  plugins:
                    ingest: geoip, user_agent
                index: gravitee
                settings:
                  number_of_replicas: 2
                  number_of_shards: 2
                  refresh_interval: 10s
                bulk:
                  actions: 1000           # Number of requests action before flush
                  flush_interval: 5       # Flush interval in seconds

  - it: Check explicitly enable es
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        reporters:
          elasticsearch:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            reporters:
              # Elasticsearch reporter
              elasticsearch:
                enabled: true

  - it: Check explicitly disable es
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        reporters:
          elasticsearch:
            enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            reporters:
              # Elasticsearch reporter
              elasticsearch:
                enabled: false

  - it: Check override es lifecycle settings
    template: gateway/gateway-configmap.yaml
    set:
      es:
        index_mode: ilm
        lifecycle:
          enabled: true
          policyPropertyName: index.plugins.index_state_management.policy_id
          rolloverAliasPropertyName: index.plugins.index_state_management.rollover_alias
          policies:
            monitor: monitor
            request: request
            health: health
            log: log
            eventMetrics: eventMetrics
            decisions: decisions
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            reporters:
              # Elasticsearch reporter
              elasticsearch:
                endpoints:
                  - http://graviteeio-apim-elasticsearch-ingest-hl:9200
                index_mode: ilm
                pipeline:
                  plugins:
                    ingest: geoip, user_agent
                lifecycle:
                  policy_property_name: index.plugins.index_state_management.policy_id
                  rollover_alias_property_name: index.plugins.index_state_management.rollover_alias
                  policies:
                    monitor: monitor
                    request: request
                    health: health
                    log: log
                    event_metrics: eventMetrics
                    decisions: decisions
                index: gravitee
                settings:
                  number_of_replicas: 1
                  number_of_shards: 1
                  refresh_interval: 5s
                bulk:
                  actions: 1000           # Number of requests action before flush
                  flush_interval: 5       # Flush interval in seconds

  - it: Check es lifecycle settings when no event metrics policy is set
    template: gateway/gateway-configmap.yaml
    set:
      es:
        index_mode: ilm
        lifecycle:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      # The state every deployment is in after an upgrade. The key has to render with no value: the
      # gateway reads that as unset, where a default policy name would point the event-metrics data
      # streams at an ILM policy the cluster does not have.
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "log: my_policy\\n\\s+event_metrics: *\\n"

  - it: Check es lifecycle settings when no decisions policy is set
    template: gateway/gateway-configmap.yaml
    set:
      es:
        index_mode: ilm
        lifecycle:
          enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "event_metrics: *\\n\\s+decisions: *\\n"

  - it: Render only the Elasticsearch API key when one is set
    template: gateway/gateway-configmap.yaml
    set:
      es:
        security:
          enabled: true
          apiKey: encoded-key
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "security:\n\\s+api_key: encoded-key\n"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "username: example"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "password: example"

  - it: Render the Elasticsearch basic credentials when no API key is set
    template: gateway/gateway-configmap.yaml
    set:
      es:
        security:
          enabled: true
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "security:\n\\s+username: example\n\\s+password: example\n"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "api_key:"

  - it: Render the Elasticsearch API key even when basic authentication is disabled
    template: gateway/gateway-configmap.yaml
    set:
      es:
        security:
          enabled: false
          apiKey: encoded-key
    asserts:
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: "security:\n\\s+api_key: encoded-key\n"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "username: example"

  - it: Render no Elasticsearch credentials when security is disabled and no API key is set
    template: gateway/gateway-configmap.yaml
    set:
      es:
        security:
          enabled: false
    asserts:
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "api_key:"
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "username: example"
