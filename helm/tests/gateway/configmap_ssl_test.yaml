suite: Test Management API configmap with SSL enabled
templates:
  - "gateway/gateway-configmap.yaml"
tests:
  - it: Enable TLS
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: jks
            kubernetes: /default/secrets/api-custom-cert-opaque/keystore
            password: changeme
          sni: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s secured: true
            \s ssl:
            \s   keystore:
            \s     type: jks
            \s     password: "changeme"
            \s     kubernetes: /default/secrets/api-custom-cert-opaque/keystore
            \s   clientAuth: false
            \s   sni: true

  - it: Keystore not watched
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            watch: false
          sni: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s secured: true
            \s ssl:
            \s   keystore:
            \s     watch: false
            \s   clientAuth: false
            \s   sni: true

  - it: Keystore watched
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            watch: true
          sni: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s secured: true
            \s ssl:
            \s   keystore:
            \s     watch: true
            \s   clientAuth: false
            \s   sni: true

  - it: Keystore secret
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            secret: secret://kubernetes/my-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s secured: true
            \s ssl:
            \s   keystore:
            \s     secret: secret://kubernetes/my-secret

  - it: Keystore with empty password should render password field
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: pkcs12
            path: ${gravitee.home}/security/internal-cert.pfx
            password: ""
          sni: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s secured: true
            \s ssl:
            \s   keystore:
            \s     type: pkcs12
            \s     path: \$\{gravitee\.home\}/security/internal-cert\.pfx
            \s     password: ""
            \s   clientAuth: false
            \s   sni: true

  - it: CRL not configured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: jks
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "\\s   crl:"

  - it: CRL configured
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: jks
          crl:
            path: ${gravitee.home}/security/crl.pem
            watch: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s   crl:
            \s     path: \$\{gravitee\.home\}/security/crl\.pem
            \s     watch: true

  - it: Client certificate authorities not sent by default
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: jks
          clientAuth: required
          truststore:
            type: jks
            path: ${gravitee.home}/security/truststore.jks
            password: secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "sendClientCertificateAuthorities"

  - it: Client certificate authorities sent when explicitly enabled
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: jks
          clientAuth: required
          sendClientCertificateAuthorities: true
          truststore:
            type: jks
            path: ${gravitee.home}/security/truststore.jks
            password: secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s   clientAuth: required
            \s   sendClientCertificateAuthorities: true

  - it: Client certificate authorities sent on a server of the servers list
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        servers:
          - type: http
            port: 8082
            secured: true
            ssl:
              keystore:
                type: jks
              clientAuth: required
              sendClientCertificateAuthorities: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s     clientAuth: required
            \s     sendClientCertificateAuthorities: true

  - it: Client certificate authorities sent on the Kafka listener
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        kafka:
          enabled: true
          ssl:
            clientAuth: required
            sendClientCertificateAuthorities: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s   clientAuth: required
            \s   sendClientCertificateAuthorities: true

  - it: PEM keystore certificates on the default listener
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: pem
            certificates:
              - cert: /mnt/cert/tls.crt
                key: /mnt/cert/tls.key
              - cert: /mnt/cert/second.crt
                key: /mnt/cert/second.key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s   keystore:
            \s     type: pem
            \s     certificates:
            \s       - cert: /mnt/cert/tls.crt
            \s         key: /mnt/cert/tls.key
            \s       - cert: /mnt/cert/second.crt
            \s         key: /mnt/cert/second.key

  - it: PEM keystore certificates on a server of the servers list
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        servers:
          - type: http
            port: 8082
            secured: true
            ssl:
              clientAuth: required
              keystore:
                type: pem
                certificates:
                  - cert: /mnt/cert/tls.crt
                    key: /mnt/cert/tls.key
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s     keystore:
            \s       type: pem
            \s       certificates:
            \s         - cert: /mnt/cert/tls.crt
            \s           key: /mnt/cert/tls.key

  - it: No certificates entry when the keystore declares none
    template: gateway/gateway-configmap.yaml
    set:
      gateway:
        ssl:
          enabled: true
          keystore:
            type: jks
            path: /opt/keystore.jks
            password: changeme
    asserts:
      # Anchored on the keystore still rendering: without this the assertion would also pass
      # if the whole block disappeared, which is not what it is guarding against.
      - matchRegex:
          path: data["gravitee.yml"]
          pattern: |
            \s   keystore:
            \s     type: jks
            \s     path: /opt/keystore.jks
      - notMatchRegex:
          path: data["gravitee.yml"]
          pattern: "certificates:"
