version: 2.1

orbs:
    continuation: circleci/continuation@1.1.0
    node: circleci/node@7.2.1
    keeper: gravitee-io/keeper@0.7.1
    slack: circleci/slack@5.1.1

setup: true

parameters:
    gio_action:
        type: enum
        enum:
            [
                full_release,
                pull_requests,
                build_chainguard_images,
                build_chainguard_fips_images,
                bridge_compatibility_tests,
                publish_docker_images,
                repositories_tests,
                integration_tests,
                nightly,
                helm_tests,
                prepare_core_release,
                prepare_distribution_release,
                run_e2e_tests,
            ]
        default: pull_requests
    dry_run:
        type: boolean
        default: true
        description: "Run in dry run mode?"
    docker_tag_as_latest:
        default: false
        type: boolean
        description: "Is this version the latest version available ?"
    graviteeio_version:
        default: ""
        type: string
        description: "Version of APIM to be used in docker images"
    apim_version_path:
        default: "/home/circleci/project/pom.xml"
        type: string
        description: "Path to pom.xml with APIM version"
jobs:
    generate-config:
        executor:
          name: node/default
          tag: "24.18"
        environment:
            CI_ACTION: "<< pipeline.parameters.gio_action >>"
            CI_DRY_RUN: "<< pipeline.parameters.dry_run >>"
            CI_GRAVITEEIO_VERSION: "<< pipeline.parameters.graviteeio_version >>"
            CI_DOCKER_TAG_AS_LATEST: "<< pipeline.parameters.docker_tag_as_latest >>"
            APIM_VERSION_PATH: "<< pipeline.parameters.apim_version_path >>"
        steps:
            - checkout
            - keeper/env-export:
                  secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
                  var-name: GITHUB_TOKEN
            - when:
                  condition:
                      not:
                          or:
                              # A tag build has no branch to diff against, and the search below halts
                              # the pipeline when it finds none. Nothing is compared on that path: the
                              # release publishes the tag, whatever changed to get there.
                              - << pipeline.git.tag >>
                              - equal: ["master", << pipeline.git.branch >>]
                              - matches:
                                    pattern: "^[0-9]+\\.[0-9]+\\.x$"
                                    value: << pipeline.git.branch >>
                  steps:
                      - run:
                            name: Find base branch
                            command: |
                                # `--fail`, so that an error body -- a rate limited 403 included -- stops being
                                # parsed like an answer: the jq defaults below used to turn it into `origin/master`.
                                # Nothing here is fatal any more; a missing answer falls through to the history walk.
                                if [ "x${CIRCLE_PULL_REQUEST}" != "x" ] && [ "x${GITHUB_TOKEN}" != "x" ]; then
                                  PULL_REQUEST_URL=$(echo https://api.github.com/repos/${CIRCLE_PULL_REQUEST:19} | sed "s/\/pull\//\/pulls\//")

                                  # `--max-time`, because a connection that never answers is the one failure
                                  # `--fail` cannot turn into a fall through: it would sit here until the job times out.
                                  if PULL_REQUEST_RESPONSE_CONTENT=$(curl -sS --fail --max-time 10 -H "Authorization: token ${GITHUB_TOKEN}" ${PULL_REQUEST_URL}); then
                                    PULL_REQUEST_BASE=$(echo $PULL_REQUEST_RESPONSE_CONTENT | jq -r '.base.ref // ""')
                                    COMMON_COMMIT=$(echo $PULL_REQUEST_RESPONSE_CONTENT | jq -r '.base.sha // ""')

                                    if [ "x${PULL_REQUEST_BASE}" != "x" ] && [ "x${COMMON_COMMIT}" != "x" ]; then
                                      BASE_REF=origin/${PULL_REQUEST_BASE}
                                    else
                                      COMMON_COMMIT=""
                                    fi
                                  else
                                    echo "The GitHub API did not answer, looking for the base branch in the history."
                                  fi
                                fi

                                # No pull request, or no usable answer: find the first commit that is also on `origin/master`
                                # or on a support branch.
                                if [ "x${COMMON_COMMIT}" == "x" ]; then
                                  MAX_COMMITS=100
                                  PATTERN="origin/master|origin/[0-9]+\.[0-9]+\.x"

                                  for (( i = 0; i < MAX_COMMITS; i++ )); do
                                    hash=$(git rev-parse HEAD~$i)

                                    # `head -1`: a commit usually sits on several branches, and `origin/HEAD -> origin/master`
                                    # alone makes `origin/master` match twice. Several lines here means several lines in
                                    # $BASH_ENV, which every later step sources under `bash -eo pipefail` before running.
                                    branch=$(git --no-pager branch -r --contains $hash | grep -oE $PATTERN | head -1 || true)

                                    if [ -n "$branch" ]; then
                                      BASE_REF=$branch
                                      COMMON_COMMIT=$hash
                                      break
                                    fi
                                  done
                                fi

                                # if BASE_REF is empty just stop
                                if [ "x${BASE_REF}" == "x" ]; then
                                  echo "No base branch found, stopping"
                                  circleci step halt
                                fi;

                                # `%q`, because on the pull request path these values come from the API rather than from
                                # the pattern above, and `git check-ref-format` allows `;`, `&` and backticks in a branch
                                # name — which $BASH_ENV would hand to every later step.
                                printf 'export GIT_BASE_BRANCH=%q\n' "${BASE_REF}" >> $BASH_ENV
                                echo "The base branch is ${BASE_REF}"

                                printf 'export GIT_COMMON_COMMIT_HASH=%q\n' "${COMMON_COMMIT}" >> $BASH_ENV
                                echo "The common commit hash is ${COMMON_COMMIT}"

            - node/install-packages:
                  app-dir: .circleci/ci
                  override-ci-command: npm install
            - run:
                  name: Lint & Test CI Project
                  working_directory: .circleci/ci
                  command: |
                      npm run lint && npm run test
            - run:
                  name: Generate config
                  working_directory: .circleci/ci
                  command: |
                      npm run generate /tmp/dynamicConfig.yml
            - continuation/continue:
                  configuration_path: /tmp/dynamicConfig.yml

# Filters on both tags and branches are needed on every job below: CircleCI does not run a job for a
# tag unless the job says so, and does not stop running it for branches unless the job says that too.
workflows:
    dynamic-workflow:
        when:
            not: << pipeline.git.tag >>
        jobs:
            - generate-config:
                  context: cicd-orchestrator
                  filters:
                      tags:
                          ignore:
                              - /.*/

    # The core reactor publishes from its own tag. The version is the tag, so nothing is passed as a
    # pipeline parameter and the artefacts are built from the tagged tree rather than from a branch
    # head that has moved on.
    core-release:
        when:
            # The delimiting slashes are optional here — the `matches` above, on the branch, has none
            # and both forms work. This spelling is the one proven on tags: it is what the plugin
            # repositories run, and their release workflow does start on a pushed tag. Nothing in the
            # test suite covers this file, so leave it as it is rather than aligning the two by eye.
            matches:
                pattern: "/^core_(\\d+\\.\\d+\\.\\d+(-[a-z]+\\.\\d+)?)$/"
                value: << pipeline.git.tag >>
        jobs:
            - generate-config:
                  context: cicd-orchestrator
                  filters:
                      branches:
                          ignore:
                              - /.*/
                      tags:
                          only:
                              - /^core_(\d+\.\d+\.\d+(-[a-z]+\.\d+)?)$/
