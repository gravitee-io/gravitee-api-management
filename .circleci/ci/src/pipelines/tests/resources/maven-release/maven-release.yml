version: 2.1
setup: false
parameters:
  gio_action:
    type: string
    default: pull_requests
    description: ""
  dry_run:
    type: boolean
    default: true
    description: Run in dry run mode?
  docker_tag_as_latest:
    type: boolean
    default: false
    description: Is this version the latest version available?
  graviteeio_version:
    type: string
    default: ""
    description: Version of APIM to be used in docker images
  apim_version_path:
    type: string
    default: /home/circleci/project/pom.xml
    description: Path to pom.xml with APIM version
commands:
  cmd-restore-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}
    description: Restore Maven cache for a dedicated job
  cmd-prepare-gpg:
    steps:
      - keeper/install
      - run:
          command: |-
            ksm secret notation keeper://riW92t8X4tk4ZmQc8-FZ4Q/custom_field/armor_format_pub_key > pub.key
            gpg --import pub.key

            ksm secret notation keeper://riW92t8X4tk4ZmQc8-FZ4Q/custom_field/armor_format_private_key > private.key
            # Need --batch to be able to import private key
            gpg --import --batch private.key
    description: Prepare GPG command
  cmd-save-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - run:
          name: Exclude all APIM artefacts from cache.
          command: rm -rf ~/.m2/repository/io/gravitee/apim
          when: always
      - run:
          name: Drop failed resolution markers from cache.
          command: find ~/.m2 -name '*.lastUpdated' -delete
          when: always
      - save_cache:
          key: gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
          when: always
    description: Save Maven cache for a dedicated job
  cmd-azure-artifacts-token:
    steps:
      - keeper/install
      - run:
          name: Get an Azure Artifacts token
          command: |-
            CLIENT_ID=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/login)
            CLIENT_SECRET=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/password)
            TENANT=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/custom_field/tenant)

            # --data-urlencode rather than -d, which sends its argument verbatim: a client secret holding
            # a +, & or = is mangled by the form decoder on the other side. Entra secrets routinely do.
            #
            # The status is captured instead of being left to --fail. Steps run under `bash -eo pipefail`,
            # where a failing command substitution aborts the step on the spot — the diagnostics below would
            # never run, and the job would die without printing anything at all.
            RESPONSE=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -w '\n%{http_code}' -X POST \
              "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "scope=499b84ac-1321-427f-aa17-267ca6975798/.default" \
              --data-urlencode "grant_type=client_credentials") || RESPONSE=""

            CODE=$(printf '%s' "$RESPONSE" | tail -1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            if [ "$CODE" != "200" ]; then
              echo "Entra refused to issue a token (HTTP ${CODE:-no answer})." >&2
              # || true: a non-JSON body would make jq exit non-zero and, under pipefail, cut the two
              # lines below — losing the diagnostics this branch exists to print.
              printf '%s' "$BODY" | jq -r '.error_description // empty' >&2 || true
              echo "Same secret as job-deploy-on-azure: if it expired, that job is failing too." >&2
              exit 1
            fi

            TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token // empty') || TOKEN=''
            if [ -z "$TOKEN" ]; then
              echo "Entra answered 200 with no access_token in the body." >&2
              exit 1
            fi

            # The one value that has to reach the next steps, so it goes through BASH_ENV. It is a JWT —
            # base64url and dots, nothing the shell can expand — and it never came from Keeper.
            echo "export AZURE_ARTIFACTS_PAT='${TOKEN}'" >> "$BASH_ENV"
    description: Get a short-lived Azure Artifacts token
jobs:
  job-setup:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - keeper/install
      - run:
          name: Get the Maven settings
          command: |-
            ksm secret notation keeper://7CgijuGiFDSLynRJt1Dm9w/custom_field/xml_azure > .gravitee.settings.xml

            # An empty or truncated file would only surface later, in another job, as an unreadable
            # settings or a 401 blamed on the credentials.
            if ! grep -q '</settings>' .gravitee.settings.xml; then
              echo "The Maven settings read from Keeper are empty or truncated." >&2
              exit 1
            fi
      - persist_to_workspace:
          root: .
          paths:
            - .gravitee.settings.xml
  job-release-commit-and-prepare-next-version:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - add_ssh_keys:
          fingerprints:
            - ac:88:23:8f:c6:0f:7d:f0:fc:df:73:20:34:56:02:6c
      - keeper/env-export:
          secret-url: keeper://IZd-yvsMopfQEa_0j1SDvg/field/login
          var-name: GIT_USER_NAME
      - keeper/env-export:
          secret-url: keeper://IZd-yvsMopfQEa_0j1SDvg/custom_field/email
          var-name: GIT_USER_EMAIL
      - run:
          name: Git config
          command: |-
            git config --global user.name "${GIT_USER_NAME}"
             git config --global user.email "${GIT_USER_EMAIL}"
      - run:
          name: "Git release "
          command: |
            # Remove `-SNAPSHOT` from source
            # Backend
            sed -i "s#<changelist>.*</changelist>#<changelist></changelist>#" pom.xml

            # UI
            sed -i 's/"version": ".*"/"version": "1.2.3"/' gravitee-apim-console-webui/build.json
            sed -i 's/"version": ".*"/"version": "1.2.3"/' gravitee-apim-portal-webui/build.json
            sed -i 's/"version": ".*"/"version": "1.2.3"/' gravitee-apim-portal-webui-next/build.json
            sed -i 's/"version": ".*"/"version": "1.2.3"/' gravitee-gamma/gravitee-gamma-control-plane-webui/build.json

            git add --update
            git commit -m "1.2.3"
            git tag 1.2.3

            # Set the version to the next version (bump patch version + '-SNAPSHOT')
            sed -i "s#<revision>.*</revision>#<revision>1.2.4</revision>#" pom.xml                   
            sed -i "s#<changelist>.*</changelist>#<changelist>-SNAPSHOT</changelist>#" pom.xml
            sed -i "s#<sha1>.*</sha1>#<sha1></sha1>#" pom.xml

            sed -i 's#version: ".*"#version: "1.2.4-SNAPSHOT"#' gravitee-apim-rest-api/gravitee-apim-rest-api-portal/gravitee-apim-rest-api-portal-rest/src/main/resources/portal-openapi.yaml
            sed -i 's#"version": ".*"#"version": "1.2.4-SNAPSHOT"#' gravitee-apim-console-webui/build.json
            sed -i 's#"version": ".*"#"version": "1.2.4-SNAPSHOT"#' gravitee-apim-portal-webui/build.json
            sed -i 's#"version": ".*"#"version": "1.2.4-SNAPSHOT"#' gravitee-apim-portal-webui-next/build.json
            sed -i 's#"version": ".*"#"version": "1.2.4-SNAPSHOT"#' gravitee-gamma/gravitee-gamma-control-plane-webui/build.json

            # Helm chart increase version, appVersion and clean the artifacthub.io/changes annotation
            sed -e "0,/^version:/{s/version:.*/version: 1.2.4/}" \
                -e "0,/^appVersion:/{ s/appVersion.*/appVersion: 1.2.4/ }" \
                -e '/artifacthub.io\/changes/,${ s/|// }' \
                -e '/artifacthub.io\/changes:/q0' \
                -i helm/Chart.yaml

            git add --update
            git commit -m 'chore: prepare next version [skip ci]'

            git push -u  origin master
            git push --tags  origin master
  job-publish-release:
    docker:
      - image: cimg/openjdk:21.0.9-node
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Checkout tag 1.2.3
          command: git checkout 1.2.3
      - cmd-restore-maven-job-cache:
          jobName: job-publish-release
      - attach_workspace:
          at: .
      - cmd-prepare-gpg
      - cmd-azure-artifacts-token
      - run:
          name: Maven deploy to the Azure feed (releases)
          command: mvn clean deploy --activate-profiles gio-release --batch-mode -T 4 -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=true --settings .gravitee.settings.xml --update-snapshots -DaltDeploymentRepository=azure-artifacts-gravitee::https://pkgs.dev.azure.com/graviteeio/packages/_packaging/gravitee/maven/v1
      - cmd-save-maven-job-cache:
          jobName: job-publish-release
      - cmd-azure-artifacts-token
      - keeper/env-export:
          secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
          var-name: GITHUB_TOKEN
      - run:
          name: Promote the release to the @public view of the Azure feed
          environment:
            MAVEN_SETTINGS: .gravitee.settings.xml
            MAVEN_PROFILES: gio-release
            PROMOTE_DRY_RUN: "false"
          command: bash .circleci/scripts/promote-to-view.sh
      - store_artifacts:
          path: /tmp/promote-to-view
          destination: promote-to-view
workflows:
  maven_release:
    jobs:
      - job-setup:
          context:
            - cicd-orchestrator
          name: Setup
      - job-release-commit-and-prepare-next-version:
          context:
            - cicd-orchestrator
          name: Commit and prepare next version
          requires:
            - Setup
      - job-publish-release:
          context:
            - cicd-orchestrator
          name: Publish release
          requires:
            - Commit and prepare next version
orbs:
  keeper: gravitee-io/keeper@0.7.3
