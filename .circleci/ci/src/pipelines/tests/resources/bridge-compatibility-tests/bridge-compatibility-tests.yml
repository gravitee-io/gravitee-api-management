version: 2.1
setup: false
parameters:
  gio_action:
    type: string
    default: pull_requests
    description: ""
  dry_run:
    type: boolean
    default: true
    description: Run in dry run mode?
  docker_tag_as_latest:
    type: boolean
    default: false
    description: Is this version the latest version available?
  graviteeio_version:
    type: string
    default: ""
    description: Version of APIM to be used in docker images
  apim_version_path:
    type: string
    default: /home/circleci/project/pom.xml
    description: Path to pom.xml with APIM version
commands:
  cmd-restore-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}
    description: Restore Maven cache for a dedicated job
  cmd-save-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - run:
          name: Exclude all APIM artefacts from cache.
          command: rm -rf ~/.m2/repository/io/gravitee/apim
      - run:
          name: Drop failed resolution markers from cache.
          command: find ~/.m2 -name '*.lastUpdated' -delete
      - save_cache:
          key: gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
          when: always
    description: Save Maven cache for a dedicated job
  cmd-notify-on-failure:
    steps:
      - keeper/env-export:
          secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
          var-name: SLACK_ACCESS_TOKEN
      - slack/notify:
          channel: C08H9K43WSV
          branch_pattern: master,[0-9]+\.[0-9]+\.x
          event: fail
          template: basic_fail_1
  cmd-azure-artifacts-token:
    steps:
      - keeper/install
      - run:
          name: Get an Azure Artifacts token
          command: |-
            CLIENT_ID=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/login)
            CLIENT_SECRET=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/password)
            TENANT=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/custom_field/tenant)

            # --data-urlencode rather than -d, which sends its argument verbatim: a client secret holding
            # a +, & or = is mangled by the form decoder on the other side. Entra secrets routinely do.
            #
            # The status is captured instead of being left to --fail. Steps run under `bash -eo pipefail`,
            # where a failing command substitution aborts the step on the spot — the diagnostics below would
            # never run, and the job would die without printing anything at all.
            RESPONSE=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -w '\n%{http_code}' -X POST \
              "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "scope=499b84ac-1321-427f-aa17-267ca6975798/.default" \
              --data-urlencode "grant_type=client_credentials") || RESPONSE=""

            CODE=$(printf '%s' "$RESPONSE" | tail -1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            if [ "$CODE" != "200" ]; then
              echo "Entra refused to issue a token (HTTP ${CODE:-no answer})." >&2
              printf '%s' "$BODY" | sed -n 's/.*"error_description":"\([^"]*\)".*/  \1/p' >&2
              echo "Same secret as job-deploy-on-azure: if it expired, that job is failing too." >&2
              exit 1
            fi

            TOKEN=$(printf '%s' "$BODY" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
            if [ -z "$TOKEN" ]; then
              echo "Entra answered 200 with no access_token in the body." >&2
              exit 1
            fi

            # The one value that has to reach the next steps, so it goes through BASH_ENV. It is a JWT —
            # base64url and dots, nothing the shell can expand — and it never came from Keeper.
            echo "export AZURE_ARTIFACTS_PAT='${TOKEN}'" >> "$BASH_ENV"
      - run:
          name: Check the feed answers
          command: |-
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -u "bot:${AZURE_ARTIFACTS_PAT}" \
              "https://pkgs.dev.azure.com/graviteeio/packages/_packaging/gravitee/maven/v1/io/gravitee/canary/feed-canary/1.0.0/feed-canary-1.0.0.pom") || CODE=000

            case "$CODE" in
              200) echo "The feed resolves the canary." ;;
              401) echo "401 — the feed rejected the token." >&2; exit 1 ;;
              403) echo "403 — Gravitee.io Bot has no role on the feed." >&2; exit 1 ;;
              404) echo "404 — token accepted but the canary is gone; publish it again." >&2; exit 1 ;;
              # Everything else is the feed being unavailable rather than misconfigured, and that is what
              # the Artifactory fallback exists to absorb. Failing here would remove the resilience this
              # design was built around.
              *)   echo "The feed answered HTTP ${CODE}; carrying on, Maven falls back to Artifactory." >&2 ;;
            esac
    description: Get a short-lived Azure Artifacts token
  cmd-install-yarn:
    steps:
      - run:
          name: Enable Corepack and Set Yarn Version
          command: |-
            corepack enable || sudo corepack enable
                    yarn set version 4.1.1
  cmd-webui-install:
    parameters:
      apim-ui-project:
        type: string
        default: ""
        description: the name of the UI project to build
      apim-ui-project-workdir:
        type: string
        default: ""
        description: the directory of the UI project to build
    steps:
      - restore_cache:
          name: Restore Yarn cache
          keys:
            - << parameters.apim-ui-project >>-cache-v1-{{ .Branch }}-{{ checksum "<< parameters.apim-ui-project-workdir >>/yarn.lock" }}
            - << parameters.apim-ui-project >>-cache-v1-{{ .Branch }}
      - run:
          name: Install dependencies
          command: yarn
          working_directory: << parameters.apim-ui-project-workdir >>
      - save_cache:
          name: Save Yarn cache
          key: << parameters.apim-ui-project >>-cache-v1-{{ .Branch }}-{{ checksum "<< parameters.apim-ui-project-workdir >>/yarn.lock" }}
          paths:
            - ./<< parameters.apim-ui-project-workdir >>/node_modules
  cmd-docker-login:
    steps:
      - keeper/env-export:
          secret-url: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/login
          var-name: DOCKER_REGISTRY_USERNAME
      - keeper/env-export:
          secret-url: keeper://Q721P2LSOPJ9qiXLuf5AHQ/field/password
          var-name: DOCKER_REGISTRY_PASSWORD
      - run:
          name: Login to Azure Container Registry
          command: echo $DOCKER_REGISTRY_PASSWORD | docker login --username $DOCKER_REGISTRY_USERNAME --password-stdin graviteeio.azurecr.io
    description: Login to Azure Container Registry
  cmd-docker-logout:
    steps:
      - run:
          name: Logout from Azure Container Registry
          command: docker logout graviteeio.azurecr.io
    description: Logout from Azure Container Registry
jobs:
  job-setup:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - keeper/install
      - run:
          name: Get the Maven settings
          command: |-
            ksm secret notation keeper://7CgijuGiFDSLynRJt1Dm9w/custom_field/xml_azure > .gravitee.settings.xml

            # An empty or truncated file would only surface later, in another job, as an unreadable
            # settings or a 401 blamed on the credentials.
            if ! grep -q '</settings>' .gravitee.settings.xml; then
              echo "The Maven settings read from Keeper are empty or truncated." >&2
              exit 1
            fi
      - persist_to_workspace:
          root: .
          paths:
            - .gravitee.settings.xml
  job-validate:
    docker:
      - image: cimg/openjdk:25.0.3
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-validate
      - cmd-azure-artifacts-token
      - run:
          name: Validate project
          command: mvn -s .gravitee.settings.xml validate -Dgravitee.archrules.skip=true --no-transfer-progress -Pall-modules -T 8
      - run:
          name: Validate distribution
          command: mvn -s .gravitee.settings.xml -f gravitee-apim-distribution/pom.xml validate -nsu -Dgravitee.archrules.skip=true --no-transfer-progress -Pintegration-tests-modules -T 8
      - run:
          name: Check both reactors carry the same version
          command: |-
            triplet() {
              rev=$(grep -o '<revision>[^<]*</revision>' "$1" | head -1 | sed -E 's#</?revision>##g')
              chg=$(grep -o '<changelist>[^<]*</changelist>' "$1" | head -1 | sed -E 's#</?changelist>##g')
              # <sha1 /> and <sha1></sha1> mean the same thing; normalise both to the empty string.
              sha=$(grep -oE '<sha1 */>|<sha1>[^<]*</sha1>' "$1" | head -1 | sed -E 's#<sha1 */>##; s#</?sha1>##g')
              echo "revision=$rev sha1=$sha changelist=$chg"
            }
            ROOT=$(triplet pom.xml)
            DIST=$(triplet gravitee-apim-distribution/pom.xml)
            echo "root:         $ROOT"
            echo "distribution: $DIST"
            if [ "$ROOT" != "$DIST" ]; then
              echo
              echo "The root pom and the distribution pom disagree on the version being built."
              echo "Both must be bumped together — see release/code-freeze/_common.sh and"
              echo "job-release-commit-and-prepare-next-version."
              exit 1
            fi
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-validate
  job-build:
    docker:
      - image: cimg/openjdk:25.0.3-node
    resource_class: xlarge
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-build
      - cmd-install-yarn
      - cmd-azure-artifacts-token
      - run:
          name: Build engine
          command: mvn -s .gravitee.settings.xml clean install --no-transfer-progress --update-snapshots -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=false -T 8 -P all-modules -DwithJavadoc
          environment:
            BUILD_ID: "1234"
            BUILD_NUMBER: "1234"
            GIT_COMMIT: 784ff35ca
            MAVEN_OPTS: -Xmx2048m
      - run:
          name: Build distribution
          command: mvn -s .gravitee.settings.xml -f gravitee-apim-distribution/pom.xml clean install --no-transfer-progress -nsu -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=false -T 8 -Dbundle=dev -Pengine-snapshot,integration-tests-modules -DwithJavadoc
          environment:
            MAVEN_OPTS: -Xmx2048m
      - cmd-notify-on-failure
      - save_cache:
          paths:
            - ~/.m2/repository/io/gravitee/apim
            - ~/.m2/repository/io/gravitee/gamma
          key: gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - run:
          name: Archive the compiled rest-api classes
          command: tar -cf /tmp/rest-api-classes.tar ./gravitee-apim-rest-api/*/target/classes ./gravitee-apim-rest-api/*/target/test-classes ./gravitee-apim-rest-api/*/*/target/classes ./gravitee-apim-rest-api/*/*/target/test-classes
      - save_cache:
          paths:
            - /tmp/rest-api-classes.tar
          key: gravitee-api-management-v15-rest-api-classes-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - cmd-save-maven-job-cache:
          jobName: job-build
      - persist_to_workspace:
          root: ./
          paths:
            - ./gravitee-apim-rest-api/gravitee-apim-rest-api-management/gravitee-apim-rest-api-management-rest/target/classes/console-openapi.*
            - ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-rest-api/target/distribution
            - ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-gateway/target/distribution
  job-e2e-generate-sdk:
    docker:
      - image: cimg/openjdk:25.0.3-node
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-install-yarn
      - run:
          name: Generate e2e tests SDK
          command: |-
            sh ./scripts/update-management-sdk.sh
            sh ./scripts/update-management-v2-sdk.sh
            sh ./scripts/update-portal-sdk.sh
          working_directory: gravitee-apim-distribution/gravitee-apim-distribution-e2e
      - cmd-webui-install:
          apim-ui-project: gravitee-apim-distribution/gravitee-apim-distribution-e2e
          apim-ui-project-workdir: gravitee-apim-distribution/gravitee-apim-distribution-e2e
      - cmd-notify-on-failure
      - persist_to_workspace:
          root: .
          paths:
            - gravitee-apim-distribution/gravitee-apim-distribution-e2e/lib/management-webclient-sdk
            - gravitee-apim-distribution/gravitee-apim-distribution-e2e/lib/management-v2-webclient-sdk
            - gravitee-apim-distribution/gravitee-apim-distribution-e2e/lib/portal-webclient-sdk
  job-e2e-lint-build:
    docker:
      - image: cimg/node:24.18.0
    resource_class: small
    steps:
      - checkout
      - cmd-install-yarn
      - cmd-webui-install:
          apim-ui-project: gravitee-apim-distribution/gravitee-apim-distribution-e2e
          apim-ui-project-workdir: gravitee-apim-distribution/gravitee-apim-distribution-e2e
      - attach_workspace:
          at: .
      - run:
          name: Check License
          command: yarn lint:license
          working_directory: gravitee-apim-distribution/gravitee-apim-distribution-e2e
      - run:
          name: Run Prettier and ESLint
          command: yarn lint
          working_directory: gravitee-apim-distribution/gravitee-apim-distribution-e2e
      - run:
          name: Build
          command: yarn build
          working_directory: gravitee-apim-distribution/gravitee-apim-distribution-e2e
      - cmd-notify-on-failure
      - persist_to_workspace:
          root: .
          paths:
            - gravitee-apim-distribution/gravitee-apim-distribution-e2e/dist
            - gravitee-apim-distribution/gravitee-apim-distribution-e2e/node_modules
  job-e2e-test:
    parameters:
      apim_client_tag:
        type: string
        default: ""
      execution_mode:
        type: string
        default: ""
      database:
        type: string
        default: ""
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-docker-login
      - keeper/env-export:
          secret-url: keeper://w8WBpALVCgYdxtV5pVrQsw/custom_field/base64
          var-name: GRAVITEE_LICENSE
      - cmd-install-yarn
      - run:
          name: Running API & E2E tests in << parameters.execution_mode >> mode with << parameters.database >> database
          command: |-
            cd gravitee-apim-distribution/gravitee-apim-distribution-e2e
            if [ "<< parameters.execution_mode >>" = "v3" ]; then
              echo "Disable v4 emulation engine on APIM Gateway and Rest API"
              export V4_EMULATION_ENGINE_DEFAULT=no
            fi
            if [ -z "<< parameters.apim_client_tag >>" ]; then
              APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-latest APIM_CLIENT_REGISTRY=graviteeio.azurecr.io APIM_CLIENT_TAG=master-latest yarn test:api:<< parameters.database >>
            else 
              if [[ "<< parameters.apim_client_tag >>" == *"@"* ]]; then
                echo "Using custom registry for client"
                CLIENT_REGISTRY=$(echo "<< parameters.apim_client_tag >>" | cut -f1 -d@)
                CLIENT_TAG=$(echo "<< parameters.apim_client_tag >>" | cut -f2 -d@)
                APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-latest APIM_CLIENT_REGISTRY=${CLIENT_REGISTRY} APIM_CLIENT_TAG=${CLIENT_TAG} yarn test:api:<< parameters.database >>
              else
                echo "Using ACR registry for client"
                APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-latest APIM_CLIENT_REGISTRY=graviteeio.azurecr.io APIM_CLIENT_TAG=<< parameters.apim_client_tag >> yarn test:api:<< parameters.database >>
              fi
            fi
      - cmd-docker-logout
      - cmd-notify-on-failure
      - store_test_results:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.tmp/e2e-test-report.xml
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.tmp/e2e-test-report.xml
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.logs
workflows:
  bridge_compatibility_tests:
    jobs:
      - job-setup:
          context:
            - cicd-orchestrator
          name: Setup
      - job-validate:
          context:
            - cicd-orchestrator
          name: Validate
          requires:
            - Setup
      - job-build:
          context:
            - cicd-orchestrator
          name: Build backend
          requires:
            - Validate
      - job-e2e-generate-sdk:
          context:
            - cicd-orchestrator
          name: Generate e2e tests SDK
          requires:
            - Build backend
      - job-e2e-lint-build:
          context:
            - cicd-orchestrator
          name: Lint & Build APIM e2e
          requires:
            - Generate e2e tests SDK
      - job-e2e-test:
          context:
            - cicd-orchestrator
          name: E2E - << matrix.execution_mode >> - << matrix.apim_client_tag >>
          requires:
            - Lint & Build APIM e2e
          matrix:
            parameters:
              execution_mode:
                - v3
                - v4-emulation-engine
              database:
                - bridge
              apim_client_tag:
                - master-latest
                - 4.12.x-latest
                - graviteeio@4.12.0
                - 4.11.x-latest
                - graviteeio@4.11.0
                - 4.10.x-latest
                - graviteeio@4.10.0
orbs:
  keeper: gravitee-io/keeper@0.7.1
  slack: circleci/slack@4.12.5
