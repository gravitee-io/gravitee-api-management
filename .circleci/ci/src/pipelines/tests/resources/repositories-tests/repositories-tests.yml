# This file is generated from the TypeScript sources in .circleci/ci.
# Do not edit it by hand — run `npm run generate` instead.

version: 2.1
setup: false
parameters:
  gio_action:
    type: string
    default: pull_requests
    description: ""
  dry_run:
    type: boolean
    default: true
    description: Run in dry run mode?
  docker_tag_as_latest:
    type: boolean
    default: false
    description: Is this version the latest version available?
  graviteeio_version:
    type: string
    default: ""
    description: Version of APIM to be used in docker images
  apim_version_path:
    type: string
    default: /home/circleci/project/pom.xml
    description: Path to pom.xml with APIM version
commands:
  cmd-azure-artifacts-token:
    steps:
      - keeper/install
      - run:
          name: Get an Azure Artifacts token
          command: |-
            CLIENT_ID=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/login)
            CLIENT_SECRET=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/password)
            TENANT=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/custom_field/tenant)

            # --data-urlencode rather than -d, which sends its argument verbatim: a client secret holding
            # a +, & or = is mangled by the form decoder on the other side. Entra secrets routinely do.
            #
            # The status is captured instead of being left to --fail. Steps run under `bash -eo pipefail`,
            # where a failing command substitution aborts the step on the spot — the diagnostics below would
            # never run, and the job would die without printing anything at all.
            RESPONSE=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -w '\n%{http_code}' -X POST \
              "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "scope=499b84ac-1321-427f-aa17-267ca6975798/.default" \
              --data-urlencode "grant_type=client_credentials") || RESPONSE=""

            CODE=$(printf '%s' "$RESPONSE" | tail -1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            if [ "$CODE" != "200" ]; then
              echo "Entra refused to issue a token (HTTP ${CODE:-no answer})." >&2
              # || true: a non-JSON body would make jq exit non-zero and, under pipefail, cut the two
              # lines below — losing the diagnostics this branch exists to print.
              printf '%s' "$BODY" | jq -r '.error_description // empty' >&2 || true
              echo "Same secret as job-deploy-on-azure: if it expired, that job is failing too." >&2
              exit 1
            fi

            TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token // empty') || TOKEN=''
            if [ -z "$TOKEN" ]; then
              echo "Entra answered 200 with no access_token in the body." >&2
              exit 1
            fi

            # The one value that has to reach the next steps, so it goes through BASH_ENV. It is a JWT —
            # base64url and dots, nothing the shell can expand — and it never came from Keeper.
            echo "export AZURE_ARTIFACTS_PAT='${TOKEN}'" >> "$BASH_ENV"
      - run:
          name: Check the feed answers
          command: |-
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -u "bot:${AZURE_ARTIFACTS_PAT}" \
              "https://pkgs.dev.azure.com/graviteeio/packages/_packaging/gravitee/maven/v1/io/gravitee/canary/feed-canary/1.0.0/feed-canary-1.0.0.pom") || CODE=000

            case "$CODE" in
              200) echo "The feed resolves the canary." ;;
              401) echo "401 — the feed rejected the token." >&2; exit 1 ;;
              403) echo "403 — Gravitee.io Bot has no role on the feed." >&2; exit 1 ;;
              404) echo "404 — token accepted but the canary is gone; publish it again." >&2; exit 1 ;;
              # Everything else is the feed being unavailable rather than misconfigured, and that is what
              # the Artifactory fallback exists to absorb. Failing here would remove the resilience this
              # design was built around.
              *)   echo "The feed answered HTTP ${CODE}; carrying on, Maven falls back to Artifactory." >&2 ;;
            esac
    description: Get a short-lived Azure Artifacts token
  cmd-restore-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}
    description: Restore Maven cache for a dedicated job
  cmd-save-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - run:
          name: Exclude all APIM artefacts from cache.
          command: rm -rf ~/.m2/repository/io/gravitee/apim
      - run:
          name: Drop failed resolution markers from cache.
          command: find ~/.m2 -name '*.lastUpdated' -delete
      - save_cache:
          key: gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
          when: always
    description: Save Maven cache for a dedicated job
  cmd-notify-on-failure:
    steps:
      - keeper/env-export:
          secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
          var-name: SLACK_ACCESS_TOKEN
      - slack/notify:
          channel: C08HMNYPHA4
          branch_pattern: master,[0-9]+\.[0-9]+\.x
          event: fail
          template: basic_fail_1
  cmd-install-yarn:
    steps:
      - run:
          name: Enable Corepack and Set Yarn Version
          command: |-
            corepack enable || sudo corepack enable
                    yarn set version 4.1.1
  cmd-install-jdk:
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-temurin-25
      - run:
          name: Install JDK 25
          command: |-
            JDK_HOME=/usr/lib/jvm/temurin-25
            CACHE_DIR="${HOME}/.cache/temurin"
            TARBALL="${CACHE_DIR}/temurin-25.tar.gz"

            if java -version 2>&1 | head -1 | grep -q '"25\.'; then
              # Still export JAVA_HOME, so both paths leave the environment in the same state.
              RESOLVED_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
              echo "JDK 25 already installed at ${RESOLVED_HOME}"
              echo "export JAVA_HOME=${RESOLVED_HOME}" >> "$BASH_ENV"
              exit 0
            fi

            # x64 is hardcoded because MachineResourceClass models no Arm variant, so a
            # machine job cannot run on Arm without widening that type first.
            # Resolve the latest GA of the feature release rather than pinning a build number:
            # patch drift inside a major is harmless here, a stale pin is not. The cache key
            # holds a major, so a pipeline that restores the cache stays on one patch anyway.
            mkdir -p "${CACHE_DIR}"

            if [ -f "${TARBALL}" ]; then
              echo "Reusing the cached Temurin 25 archive"
            else
              META="$(curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL \
                "https://api.adoptium.net/v3/assets/latest/25/hotspot?os=linux&architecture=x64&image_type=jdk")"
              JDK_URL="$(echo "${META}" | jq -r '.[0].binary.package.link')"
              JDK_SHA="$(echo "${META}" | jq -r '.[0].binary.package.checksum')"

              echo "Downloading $(echo "${META}" | jq -r '.[0].version.semver')"
              curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL "${JDK_URL}" -o "${TARBALL}"
              # HTTPS gives transport security, not artifact provenance: verify before extracting as root.
              echo "${JDK_SHA}  ${TARBALL}" | sha256sum -c -
            fi

            echo "Replacing $(java -version 2>&1 | head -1)"
            sudo mkdir -p "${JDK_HOME}"
            sudo tar -xzf "${TARBALL}" -C "${JDK_HOME}" --strip-components=1 --no-same-owner

            echo "export JAVA_HOME=${JDK_HOME}" >> "$BASH_ENV"
            echo "export PATH=${JDK_HOME}/bin:\$PATH" >> "$BASH_ENV"
            source "$BASH_ENV"

            java -version
      - save_cache:
          key: gravitee-api-management-v15-temurin-25
          paths:
            - ~/.cache/temurin
          when: on_success
    description: Install the JDK on machine executors, which ship an older one
jobs:
  job-setup:
    docker:
      - image: cimg/openjdk:25.0.3
    resource_class: small
    steps:
      - checkout
      - keeper/install
      - run:
          name: Get the Maven settings
          command: |-
            ksm secret notation keeper://7CgijuGiFDSLynRJt1Dm9w/custom_field/xml_azure > .gravitee.settings.xml

            # An empty or truncated file would only surface later, in another job, as an unreadable
            # settings or a 401 blamed on the credentials.
            if ! grep -q '</settings>' .gravitee.settings.xml; then
              echo "The Maven settings read from Keeper are empty or truncated." >&2
              exit 1
            fi
      - cmd-azure-artifacts-token
      - run:
          name: Check Maven resolves from the feed
          command: |-
            if ! mvn -B -q -s .gravitee.settings.xml \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              -Dartifact=io.gravitee.canary:feed-canary:1.0.0:pom; then
              echo "Maven could not resolve the canary from the feed." >&2
              echo "The token itself was accepted over HTTPS a step earlier, so what is left is the" >&2
              echo "settings wiring: a <server> id that does not match the repository id, or" >&2
              # Single quotes: the shell would try to expand this one, and a dot is not a valid
              # variable name — the message would come out as a bad substitution instead.
              echo '${env.AZURE_ARTIFACTS_PAT} not being interpolated.' >&2
              exit 1
            fi

            echo "Maven resolved io.gravitee.canary:feed-canary from the feed."
      - persist_to_workspace:
          root: .
          paths:
            - .gravitee.settings.xml
  job-build:
    docker:
      - image: cimg/openjdk:25.0.3-node
    resource_class: xlarge
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-build
      - cmd-install-yarn
      - cmd-azure-artifacts-token
      - run:
          name: Build engine
          command: mvn -s .gravitee.settings.xml clean install --no-transfer-progress --update-snapshots -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=false -T 8 -P all-modules -DwithJavadoc
          environment:
            BUILD_ID: "1234"
            BUILD_NUMBER: "1234"
            GIT_COMMIT: 784ff35ca
            MAVEN_OPTS: -Xmx2048m
      - run:
          name: Build distribution
          command: mvn -s .gravitee.settings.xml -f gravitee-apim-distribution/pom.xml clean install --no-transfer-progress -nsu -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=false -T 8 -Dbundle=dev -Pintegration-tests-modules -Dapim.core.version=4.2.0 -DwithJavadoc
          environment:
            MAVEN_OPTS: -Xmx2048m
      - cmd-notify-on-failure
      - save_cache:
          paths:
            - ~/.m2/repository/io/gravitee/apim
            - ~/.m2/repository/io/gravitee/gamma
          key: gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - run:
          name: Archive the compiled rest-api classes
          command: tar -cf /tmp/rest-api-classes.tar ./gravitee-apim-rest-api/*/target/classes ./gravitee-apim-rest-api/*/target/test-classes ./gravitee-apim-rest-api/*/*/target/classes ./gravitee-apim-rest-api/*/*/target/test-classes
      - save_cache:
          paths:
            - /tmp/rest-api-classes.tar
          key: gravitee-api-management-v15-rest-api-classes-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - cmd-save-maven-job-cache:
          jobName: job-build
      - persist_to_workspace:
          root: ./
          paths:
            - ./gravitee-apim-rest-api/gravitee-apim-rest-api-management/gravitee-apim-rest-api-management-rest/target/classes/console-openapi.*
            - ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-rest-api/target/distribution
            - ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-gateway/target/distribution
  job-jdbc-test-container:
    parameters:
      jdbcType:
        type: string
        default: ""
        description: "Type and version of the database to test. Example: mariadb:10.5"
      strictPrimaryKey:
        type: enum
        default: "false"
        description: Run MySQL/MariaDB containers with sql_require_primary_key=ON to exercise strict primary key migrations.
        enum:
          - "true"
          - "false"
    machine:
      image: ubuntu-2204:2024.08.1
      docker_layer_caching: true
    resource_class: medium
    steps:
      - checkout
      - cmd-install-jdk
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-jdbc-test-container
      - cmd-azure-artifacts-token
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Run Management repository tests with database << parameters.jdbcType >> (strictPrimaryKey=<< parameters.strictPrimaryKey >>)
          command: |-
            cd gravitee-apim-repository
            mvn -pl 'gravitee-apim-repository-jdbc' -am -s ../.gravitee.settings.xml clean package --no-transfer-progress -Dskip.validation=true -DjdbcType=<< parameters.jdbcType>> -DstrictPrimaryKey=<< parameters.strictPrimaryKey >> -T 2C
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-save-maven-job-cache:
          jobName: job-jdbc-test-container
      - store_test_results:
          path: ~/test-results
      - cmd-notify-on-failure
  job-mongo-test-container:
    parameters:
      mongoVersion:
        type: string
        default: ""
        description: Version of Mongo to test
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - cmd-install-jdk
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-mongo-test-container
      - cmd-azure-artifacts-token
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Run Management repository tests with MongoDB << parameters.mongoVersion >>
          command: |-
            cd gravitee-apim-repository
            mvn -pl 'gravitee-apim-repository-mongodb' -am -s ../.gravitee.settings.xml clean package --no-transfer-progress -Dskip.validation=true -DmongoVersion=<< parameters.mongoVersion>> -T 2C
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-save-maven-job-cache:
          jobName: job-mongo-test-container
      - store_test_results:
          path: ~/test-results
      - cmd-notify-on-failure
  job-elastic-test-container:
    parameters:
      engineType:
        type: enum
        default: elasticsearch
        description: Type of the search engine
        enum:
          - elasticsearch
          - opensearch
      engineVersion:
        type: string
        default: ""
        description: Version of engine to test
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - cmd-install-jdk
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-elastic-test-container
      - cmd-azure-artifacts-token
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Run Analytics repository tests with engine << parameters.engineType >> and version << parameters.engineVersion >>
          command: |-
            cd gravitee-apim-repository
            mvn -pl 'gravitee-apim-repository-elasticsearch' -am -s ../.gravitee.settings.xml clean package --no-transfer-progress -Dskip.validation=true -D<< parameters.engineType >>.version=<< parameters.engineVersion >> -Dsearch.type=<< parameters.engineType >> -T 2C
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-save-maven-job-cache:
          jobName: job-elastic-test-container
      - store_test_results:
          path: ~/test-results
      - cmd-notify-on-failure
  job-redis-test-container:
    parameters:
      redisImage:
        type: string
        default: ""
        description: Redis Docker image to test
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - cmd-install-jdk
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-redis-test-container
      - cmd-azure-artifacts-token
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Run Rate-limit repository tests with Redis << parameters.redisImage >>
          command: |-
            cd gravitee-apim-repository
            mvn -pl 'gravitee-apim-repository-redis' -am -s ../.gravitee.settings.xml clean package --no-transfer-progress -Dskip.validation=true -DredisImage=<< parameters.redisImage >>
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
