          jobName: job-redis-test-container
      - store_test_results:
          path: ~/test-results
      - cmd-notify-on-failure
workflows:
  repositories-tests:
    jobs:
      - job-setup:
          name: Setup
          context:
            - cicd-orchestrator
      - job-build:
          name: Build
          context:
            - cicd-orchestrator
          requires:
            - Setup
      - job-jdbc-test-container:
          name: Management repository tests - JDBC - << matrix.jdbcType >>
          context:
            - cicd-orchestrator
          requires:
            - Build
          matrix:
            parameters:
              jdbcType:
                - postgresql~14
                - postgresql~15
                - postgresql~16
                - postgresql~17
                - postgresql~18
                - mariadb~10.6
                - mariadb~10.11
                - mariadb~11.4
                - mariadb~11.8
                - mariadb~12.1
                - mysql~8.0
                - mysql~8.4
                - sqlserver~2017-latest
                - sqlserver~2019-latest
                - sqlserver~2022-latest
                - sqlserver~2025-latest
      - job-jdbc-test-container:
          name: Management repository tests - JDBC - << matrix.jdbcType >> (strict-PK)
          context:
            - cicd-orchestrator
          requires:
            - Build
          matrix:
            parameters:
              jdbcType:
                - mysql~8.4
              strictPrimaryKey:
                - "true"
      - job-mongo-test-container:
          name: Management repository tests - Mongo << matrix.mongoVersion >>
          context:
            - cicd-orchestrator
          requires:
            - Build
          matrix:
            parameters:
              mongoVersion:
                - "4.4"
                - "5.0"
                - "6.0"
                - "7.0"
                - "8.0"
      - job-elastic-test-container:
          name: Analytics repository tests - ElasticSearch << matrix.engineVersion >>
          context:
            - cicd-orchestrator
          requires:
            - Build
          matrix:
            parameters:
              engineType:
                - elasticsearch
              engineVersion:
                - 7.17.29
                - 8.19.12
                - 9.3.1
      - job-elastic-test-container:
          name: Analytics repository tests - OpenSearch << matrix.engineVersion >>
          context:
            - cicd-orchestrator
          requires:
            - Build
          matrix:
            parameters:
              engineType:
                - opensearch
              engineVersion:
                - "1"
                - "2"
                - "3"
      - job-redis-test-container:
          name: Rate Limit repository tests - Redis << matrix.redisImage >>
          context:
            - cicd-orchestrator
          requires:
            - Build
          matrix:
            parameters:
              redisImage:
                - redis/redis-stack:6.2.6-v20
                - redis/redis-stack:7.0.6-RC9
                - redis/redis-stack:7.2.0-v20
                - redis/redis-stack:7.4.0-v8
                - redis:8
orbs:
  keeper: gravitee-io/keeper@0.7.1
  slack: circleci/slack@4.12.5
