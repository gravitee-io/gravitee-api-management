# This file is generated from the TypeScript sources in .circleci/ci.
# Do not edit it by hand — run `npm run generate` instead.

version: 2.1
setup: false
parameters:
  gio_action:
    type: string
    default: pull_requests
    description: ""
  dry_run:
    type: boolean
    default: true
    description: Run in dry run mode?
  docker_tag_as_latest:
    type: boolean
    default: false
    description: Is this version the latest version available?
  graviteeio_version:
    type: string
    default: ""
    description: Version of APIM to be used in docker images
  apim_version_path:
    type: string
    default: /home/circleci/project/pom.xml
    description: Path to pom.xml with APIM version
commands:
  cmd-restore-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}
            - gravitee-api-management-v15-<< parameters.jobName >>-master
    description: Restore Maven cache for a dedicated job
  cmd-prepare-gpg:
    steps:
      - keeper/install
      - run:
          command: |-
            ksm secret notation keeper://riW92t8X4tk4ZmQc8-FZ4Q/custom_field/armor_format_pub_key > pub.key
            gpg --import pub.key

            ksm secret notation keeper://riW92t8X4tk4ZmQc8-FZ4Q/custom_field/armor_format_private_key > private.key
            # Need --batch to be able to import private key
            gpg --import --batch private.key
    description: Prepare GPG command
  cmd-save-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - run:
          name: Exclude all APIM artefacts from cache.
          command: rm -rf ~/.m2/repository/io/gravitee/apim
      - run:
          name: Drop failed resolution markers from cache.
          command: find ~/.m2 -name '*.lastUpdated' -delete
      - save_cache:
          key: gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
          when: always
    description: Save Maven cache for a dedicated job
  cmd-azure-artifacts-token:
    steps:
      - keeper/env-export:
          secret-url: keeper://UryantA7MvZe8fkWwcUt8g/field/login
          var-name: AZURE_SP_CLIENT_ID
      - keeper/env-export:
          secret-url: keeper://UryantA7MvZe8fkWwcUt8g/field/password
          var-name: AZURE_SP_CLIENT_SECRET
      - keeper/env-export:
          secret-url: keeper://UryantA7MvZe8fkWwcUt8g/custom_field/tenant
          var-name: AZURE_SP_TENANT
      - run:
          name: Get an Azure Artifacts token
          command: |-
            TOKEN=$(curl -sf -X POST \
              "https://login.microsoftonline.com/${AZURE_SP_TENANT}/oauth2/v2.0/token" \
              -d "client_id=${AZURE_SP_CLIENT_ID}" \
              -d "client_secret=${AZURE_SP_CLIENT_SECRET}" \
              -d "scope=499b84ac-1321-427f-aa17-267ca6975798/.default" \
              -d "grant_type=client_credentials" \
              | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

            if [ -z "$TOKEN" ]; then
              echo "Could not obtain an Entra token for the service principal." >&2
              echo "The client secret is the one used to push images: if it expired, those are failing too." >&2
              exit 1
            fi

            # Through BASH_ENV so the value survives to the following steps, and never appears on a
            # command line or in a process listing.
            echo "export AZURE_ARTIFACTS_PAT='${TOKEN}'" >> "$BASH_ENV"
      - run:
          name: Check the feed answers
          command: |-
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
              -u "bot:${AZURE_ARTIFACTS_PAT}" \
              "https://pkgs.dev.azure.com/graviteeio/packages/_packaging/gravitee/maven/v1/io/gravitee/canary/feed-canary/1.0.0/feed-canary-1.0.0.pom")

            case "$CODE" in
              200) echo "The feed resolves the canary." ;;
              401) echo "401 — the feed rejected the token." >&2; exit 1 ;;
              403) echo "403 — Gravitee.io Bot has no role on the feed." >&2; exit 1 ;;
              404) echo "404 — token accepted but the canary is gone; publish it again." >&2; exit 1 ;;
              *)   echo "HTTP $CODE from the feed." >&2; exit 1 ;;
            esac
    description: Get a short-lived Azure Artifacts token
jobs:
  job-setup:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - keeper/env-export:
          secret-url: keeper://7CgijuGiFDSLynRJt1Dm9w/custom_field/xml_azure
          var-name: MAVEN_SETTINGS
      - run:
          command: echo "$MAVEN_SETTINGS" > .gravitee.settings.xml
      - persist_to_workspace:
          root: .
          paths:
            - .gravitee.settings.xml
  job-nexus-staging:
    docker:
      - image: cimg/openjdk:25.0.3-node
    resource_class: xlarge
    steps:
      - checkout
      - run:
          name: Checkout tag core_4.13.0
          command: git checkout core_4.13.0
      - cmd-restore-maven-job-cache:
          jobName: job-nexus-staging
      - attach_workspace:
          at: .
      - cmd-prepare-gpg
      - cmd-azure-artifacts-token
      - run:
          name: Release on Nexus
          command: mvn clean deploy --activate-profiles gravitee-release --batch-mode -T 4 -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=true --settings .gravitee.settings.xml --update-snapshots
      - cmd-save-maven-job-cache:
          jobName: job-nexus-staging
workflows:
  core_release:
    jobs:
      - job-setup:
          context:
            - cicd-orchestrator
          name: Setup
          filters:
            branches:
              ignore:
                - /.*/
            tags:
              only:
                - /^core_(\d+\.\d+\.\d+(-[a-z]+\.\d+)?)$/
      - job-nexus-staging:
          context:
            - cicd-orchestrator
          name: Nexus staging
          requires:
            - Setup
          filters:
            branches:
              ignore:
                - /.*/
            tags:
              only:
                - /^core_(\d+\.\d+\.\d+(-[a-z]+\.\d+)?)$/
orbs:
  keeper: gravitee-io/keeper@0.7.1
