version: 2.1
setup: false
parameters:
  gio_action:
    type: string
    default: pull_requests
    description: ""
  dry_run:
    type: boolean
    default: true
    description: Run in dry run mode?
  docker_tag_as_latest:
    type: boolean
    default: false
    description: Is this version the latest version available?
  graviteeio_version:
    type: string
    default: ""
    description: Version of APIM to be used in docker images
  apim_version_path:
    type: string
    default: /home/circleci/project/pom.xml
    description: Path to pom.xml with APIM version
commands:
  cmd-notify-on-failure:
    steps:
      - keeper/env-export:
          secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
          var-name: SLACK_ACCESS_TOKEN
      - slack/notify:
          channel: C02JENTV2AX
          branch_pattern: master,[0-9]+\.[0-9]+\.x
          event: fail
          template: basic_fail_1
  cmd-azure-artifacts-token:
    steps:
      - keeper/install
      - run:
          name: Get an Azure Artifacts token
          command: |-
            CLIENT_ID=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/login)
            CLIENT_SECRET=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/field/password)
            TENANT=$(ksm secret notation keeper://UryantA7MvZe8fkWwcUt8g/custom_field/tenant)

            # --data-urlencode rather than -d, which sends its argument verbatim: a client secret holding
            # a +, & or = is mangled by the form decoder on the other side. Entra secrets routinely do.
            #
            # The status is captured instead of being left to --fail. Steps run under `bash -eo pipefail`,
            # where a failing command substitution aborts the step on the spot — the diagnostics below would
            # never run, and the job would die without printing anything at all.
            RESPONSE=$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -w '\n%{http_code}' -X POST \
              "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
              --data-urlencode "client_id=${CLIENT_ID}" \
              --data-urlencode "client_secret=${CLIENT_SECRET}" \
              --data-urlencode "scope=499b84ac-1321-427f-aa17-267ca6975798/.default" \
              --data-urlencode "grant_type=client_credentials") || RESPONSE=""

            CODE=$(printf '%s' "$RESPONSE" | tail -1)
            BODY=$(printf '%s' "$RESPONSE" | sed '$d')

            if [ "$CODE" != "200" ]; then
              echo "Entra refused to issue a token (HTTP ${CODE:-no answer})." >&2
              # || true: a non-JSON body would make jq exit non-zero and, under pipefail, cut the two
              # lines below — losing the diagnostics this branch exists to print.
              printf '%s' "$BODY" | jq -r '.error_description // empty' >&2 || true
              echo "Same secret as job-deploy-on-azure: if it expired, that job is failing too." >&2
              exit 1
            fi

            TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token // empty') || TOKEN=''
            if [ -z "$TOKEN" ]; then
              echo "Entra answered 200 with no access_token in the body." >&2
              exit 1
            fi

            # The one value that has to reach the next steps, so it goes through BASH_ENV. It is a JWT —
            # base64url and dots, nothing the shell can expand — and it never came from Keeper.
            echo "export AZURE_ARTIFACTS_PAT='${TOKEN}'" >> "$BASH_ENV"
      - run:
          name: Check the feed answers
          command: |-
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
              -u "bot:${AZURE_ARTIFACTS_PAT}" \
              "https://pkgs.dev.azure.com/graviteeio/packages/_packaging/gravitee/maven/v1/io/gravitee/canary/feed-canary/1.0.0/feed-canary-1.0.0.pom") || CODE=000

            case "$CODE" in
              200) echo "The feed resolves the canary." ;;
              401) echo "401 — the feed rejected the token." >&2; exit 1 ;;
              403) echo "403 — Gravitee.io Bot has no role on the feed." >&2; exit 1 ;;
              404) echo "404 — token accepted but the canary is gone; publish it again." >&2; exit 1 ;;
              # Everything else is the feed being unavailable rather than misconfigured, and that is what
              # the Artifactory fallback exists to absorb. Failing here would remove the resilience this
              # design was built around.
              *)   echo "The feed answered HTTP ${CODE}; carrying on, Maven falls back to Artifactory." >&2 ;;
            esac
    description: Get a short-lived Azure Artifacts token
  cmd-restore-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v14-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
            - gravitee-api-management-v14-<< parameters.jobName >>-{{ .Branch }}
            - gravitee-api-management-v14-<< parameters.jobName >>-master
    description: Restore Maven cache for a dedicated job
  cmd-save-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - run:
          name: Exclude all APIM artefacts from cache.
          command: rm -rf ~/.m2/repository/io/gravitee/apim
      - save_cache:
          key: gravitee-api-management-v14-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
          when: always
    description: Save Maven cache for a dedicated job
  cmd-install-yarn:
    steps:
      - run:
          name: Yarn Set Version Stable
          command: yarn set version 4.1.1
  cmd-webui-install:
    parameters:
      apim-ui-project:
        type: string
        default: ""
        description: the name of the UI project to build
    steps:
      - restore_cache:
          name: Restore Yarn cache
          keys:
            - << parameters.apim-ui-project >>-cache-v1-{{ .Branch }}-{{ checksum "<< parameters.apim-ui-project >>/yarn.lock" }}
            - << parameters.apim-ui-project >>-cache-v1-{{ .Branch }}
      - run:
          name: Install dependencies
          command: yarn
          working_directory: << parameters.apim-ui-project >>
      - save_cache:
          name: Save Yarn cache
          key: << parameters.apim-ui-project >>-cache-v1-{{ .Branch }}-{{ checksum "<< parameters.apim-ui-project >>/yarn.lock" }}
          paths:
            - ./<< parameters.apim-ui-project >>/node_modules
jobs:
  job-danger-js:
    docker:
      - image: cimg/node:20.11.1
    resource_class: small
    steps:
      - checkout
      - keeper/env-export:
          secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
          var-name: DANGER_GITHUB_API_TOKEN
      - run:
          name: Run Danger JS
          command: cd .circleci/danger && yarn run danger
  job-test-apim-charts:
    parameters:
      helmClientVersion:
        type: string
        default: v3.12.3
        description: Version of helm to test
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - helm/install_helm_client:
          version: << parameters.helmClientVersion >>
      - run:
          name: Install helm-unittest plugin
          command: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 0.5.1
      - run:
          name: Lint the helm charts available in helm/
          command: helm lint helm/
      - run:
          name: Install Artifact Hub CLI (ah)
          command: |-
            curl -fsSL "https://github.com/artifacthub/hub/releases/download/v1.22.0/ah_1.22.0_linux_amd64.tar.gz" | tar -xz -C /tmp ah
            sudo mv /tmp/ah /usr/local/bin/ah
            ah version
      - run:
          name: Validate Artifact Hub annotations (artifacthub.io/changes) in helm/
          command: ah lint -k helm -p helm
      - run:
          name: Execute the units tests in helm/
          command: helm unittest -f 'tests/**/*.yaml' helm/ -t JUnit -o apim-result.xml
      - store_test_results:
          path: apim-result.xml
      - cmd-notify-on-failure
  job-setup:
    docker:
      - image: cimg/openjdk:21.0.5
    resource_class: small
    steps:
      - checkout
      - keeper/install
      - run:
          name: Get the Maven settings
          command: |-
            ksm secret notation keeper://7CgijuGiFDSLynRJt1Dm9w/custom_field/xml_azure > .gravitee.settings.xml

            # An empty or truncated file would only surface later, in another job, as an unreadable
            # settings or a 401 blamed on the credentials.
            if ! grep -q '</settings>' .gravitee.settings.xml; then
              echo "The Maven settings read from Keeper are empty or truncated." >&2
              exit 1
            fi
      - cmd-azure-artifacts-token
      - run:
          name: Check Maven resolves from the feed
          command: |-
            if ! mvn -B -q -N -s .gravitee.settings.xml \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              -Dartifact=io.gravitee.canary:feed-canary:1.0.0:pom; then
              echo "Maven could not resolve the canary from the feed." >&2
              echo "If the step above reported the feed answering anything other than 200, this is that" >&2
              echo "outage: the canary exists on the feed and nowhere else, so no fallback can serve it." >&2
              echo "Otherwise the token was accepted and what is left is the settings wiring: a <server>" >&2
              echo "id that does not match the repository id, or" >&2
              # Single quotes: the shell would try to expand this one, and a dot is not a valid
              # variable name — the message would come out as a bad substitution instead.
              echo '${env.AZURE_ARTIFACTS_PAT} not being interpolated.' >&2
              exit 1
            fi

            echo "Maven resolved io.gravitee.canary:feed-canary from the feed."
      - persist_to_workspace:
          root: .
          paths:
            - .gravitee.settings.xml
  job-validate:
    docker:
      - image: cimg/openjdk:21.0.5
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-validate
      - cmd-azure-artifacts-token
      - run:
          name: Validate project
          command: mvn -s .gravitee.settings.xml validate --no-transfer-progress -Pall-modules,integration-tests-modules -T 4
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-validate
  job-build:
    docker:
      - image: cimg/openjdk:21.0.5
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-build
      - cmd-azure-artifacts-token
      - run:
          name: Build project
          command: mvn -s .gravitee.settings.xml clean install --no-transfer-progress --update-snapshots -DskipTests -Dskip.validation=true -T 8 -Dbundle=dev -P all-modules,integration-tests-modules -DwithJavadoc
          environment:
            BUILD_ID: "1234"
            BUILD_NUMBER: "1234"
            GIT_COMMIT: 784ff35ca
            MAVEN_OPTS: -Xmx2048m
      - cmd-notify-on-failure
      - save_cache:
          paths:
            - ~/.m2/repository/io/gravitee/apim
          key: gravitee-api-management-v14-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - cmd-save-maven-job-cache:
          jobName: job-build
      - persist_to_workspace:
          root: ./
          paths:
            - ./gravitee-apim-rest-api/gravitee-apim-rest-api-management/gravitee-apim-rest-api-management-rest/target/classes/console-openapi.*
            - ./gravitee-apim-rest-api/gravitee-apim-rest-api-standalone/gravitee-apim-rest-api-standalone-distribution/target/distribution
            - ./gravitee-apim-gateway/gravitee-apim-gateway-standalone/gravitee-apim-gateway-standalone-distribution/target/distribution
  job-test-definition:
    docker:
      - image: cimg/openjdk:21.0.5
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-test-definition
      - restore_cache:
          keys:
            - gravitee-api-management-v14-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - cmd-azure-artifacts-token
      - run:
          name: Run definition tests
          command: mvn --fail-fast -s .gravitee.settings.xml test --no-transfer-progress -Ddefinition-modules -Dskip.validation=true -T 2
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-test-definition
      - store_test_results:
          path: ~/test-results
      - persist_to_workspace:
          root: .
          paths:
            - gravitee-apim-definition/gravitee-apim-definition-coverage/target/site/jacoco-aggregate/
  job-sonarcloud-analysis:
    parameters:
      working_directory:
        type: string
        default: gravitee-apim-rest-api
        description: Directory where the Sonarcloud analysis will be run
      cache_type:
        type: enum
        default: backend
        description: Type of cache to use
        enum:
          - backend
          - frontend
    docker:
      - image: sonarsource/sonar-scanner-cli:11.2
    resource_class: large
    steps:
      - checkout:
          method: full
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - gravitee-api-management-v14-sonarcloud-analysis-<< parameters.cache_type >>
      - keeper/env-export:
          secret-url: keeper://9x9YgyU6DWzux4DPoHAzDQ/field/password
          var-name: SONAR_TOKEN
      - run:
          name: Run Sonarcloud Analysis
          command: sonar-scanner -Dsonar.projectVersion=4.2.0
          working_directory: << parameters.working_directory >>
          no_output_timeout: 30m
      - cmd-notify-on-failure
      - save_cache:
          paths:
            - /opt/sonar-scanner/.sonar/cache
          key: gravitee-api-management-v14-sonarcloud-analysis-<< parameters.cache_type >>
          when: always
  job-test-gateway:
    docker:
      - image: cimg/openjdk:21.0.5
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-test-gateway
      - restore_cache:
          keys:
            - gravitee-api-management-v14-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - cmd-azure-artifacts-token
      - run:
          name: Run gateway tests
          command: mvn --fail-fast -s .gravitee.settings.xml test --no-transfer-progress -Dgateway-modules -Dskip.validation=true -T 8
      - run:
