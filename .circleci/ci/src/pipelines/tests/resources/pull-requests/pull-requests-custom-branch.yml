      - persist_to_workspace:
          root: .
          paths:
            - gravitee-apim-repository/gravitee-apim-repository-coverage/target/site/jacoco-aggregate/
  job-webui-lint-test:
    parameters:
      apim-ui-project:
        type: string
        default: ""
        description: the name of the UI project to build
      resource_class:
        type: string
