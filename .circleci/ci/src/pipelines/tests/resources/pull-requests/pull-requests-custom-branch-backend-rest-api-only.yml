# This file is generated from the TypeScript sources in .circleci/ci.
# Do not edit it by hand — run `npm run generate` instead.

version: 2.1
setup: false
parameters:
  gio_action:
    type: string
    default: pull_requests
    description: ""
  dry_run:
    type: boolean
    default: true
    description: Run in dry run mode?
  docker_tag_as_latest:
    type: boolean
    default: false
    description: Is this version the latest version available?
  graviteeio_version:
    type: string
    default: ""
    description: Version of APIM to be used in docker images
  apim_version_path:
    type: string
    default: /home/circleci/project/pom.xml
    description: Path to pom.xml with APIM version
commands:
  cmd-install-yarn:
    steps:
      - run:
          name: Enable Corepack and Set Yarn Version
          command: |-
            corepack enable || sudo corepack enable
                    yarn set version 4.1.1
  cmd-restore-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
            - gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}
            - gravitee-api-management-v15-<< parameters.jobName >>-master
    description: Restore Maven cache for a dedicated job
  cmd-save-maven-job-cache:
    parameters:
      jobName:
        type: string
        default: ""
        description: The job name
    steps:
      - run:
          name: Exclude all APIM artefacts from cache.
          command: rm -rf ~/.m2/repository/io/gravitee/apim
      - run:
          name: Drop failed resolution markers from cache.
          command: find ~/.m2 -name '*.lastUpdated' -delete
      - save_cache:
          key: gravitee-api-management-v15-<< parameters.jobName >>-{{ .Branch }}-{{ checksum "pom.xml" }}
          paths:
            - ~/.m2
          when: always
    description: Save Maven cache for a dedicated job
  cmd-notify-on-failure:
    steps:
      - keeper/env-export:
          secret-url: keeper://ZOz4db245GNaETVwmPBk8w/field/password
          var-name: SLACK_ACCESS_TOKEN
      - slack/notify:
          channel: C02JENTV2AX
          branch_pattern: master,[0-9]+\.[0-9]+\.x
          event: fail
          template: basic_fail_1
  cmd-install-jdk:
    steps:
      - restore_cache:
          keys:
            - gravitee-api-management-v15-temurin-25
      - run:
          name: Install JDK 25
          command: |-
            JDK_HOME=/usr/lib/jvm/temurin-25
            CACHE_DIR="${HOME}/.cache/temurin"
            TARBALL="${CACHE_DIR}/temurin-25.tar.gz"

            if java -version 2>&1 | head -1 | grep -q '"25\.'; then
              # Still export JAVA_HOME, so both paths leave the environment in the same state.
              RESOLVED_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
              echo "JDK 25 already installed at ${RESOLVED_HOME}"
              echo "export JAVA_HOME=${RESOLVED_HOME}" >> "$BASH_ENV"
              exit 0
            fi

            # x64 is hardcoded because MachineResourceClass models no Arm variant, so a
            # machine job cannot run on Arm without widening that type first.
            # Resolve the latest GA of the feature release rather than pinning a build number:
            # patch drift inside a major is harmless here, a stale pin is not. The cache key
            # holds a major, so a pipeline that restores the cache stays on one patch anyway.
            mkdir -p "${CACHE_DIR}"

            if [ -f "${TARBALL}" ]; then
              echo "Reusing the cached Temurin 25 archive"
            else
              META="$(curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL \
                "https://api.adoptium.net/v3/assets/latest/25/hotspot?os=linux&architecture=x64&image_type=jdk")"
              JDK_URL="$(echo "${META}" | jq -r '.[0].binary.package.link')"
              JDK_SHA="$(echo "${META}" | jq -r '.[0].binary.package.checksum')"

              echo "Downloading $(echo "${META}" | jq -r '.[0].version.semver')"
              curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL "${JDK_URL}" -o "${TARBALL}"
              # HTTPS gives transport security, not artifact provenance: verify before extracting as root.
              echo "${JDK_SHA}  ${TARBALL}" | sha256sum -c -
            fi

            echo "Replacing $(java -version 2>&1 | head -1)"
            sudo mkdir -p "${JDK_HOME}"
            sudo tar -xzf "${TARBALL}" -C "${JDK_HOME}" --strip-components=1 --no-same-owner

            echo "export JAVA_HOME=${JDK_HOME}" >> "$BASH_ENV"
            echo "export PATH=${JDK_HOME}/bin:\$PATH" >> "$BASH_ENV"
            source "$BASH_ENV"

            java -version
      - save_cache:
          key: gravitee-api-management-v15-temurin-25
          paths:
            - ~/.cache/temurin
          when: on_success
    description: Install the JDK on machine executors, which ship an older one
  cmd-workspace-install:
    steps:
      - restore_cache:
          name: Restore Yarn workspace cache
          keys:
            - gravitee-api-management-v15-workspace-{{ .Branch }}-{{ checksum "yarn.lock" }}
            - gravitee-api-management-v15-workspace-{{ .Branch }}
      - run:
          name: Install workspace dependencies
          command: yarn install --frozen-lockfile
      - save_cache:
          name: Save Yarn workspace cache
          key: gravitee-api-management-v15-workspace-{{ .Branch }}-{{ checksum "yarn.lock" }}
          paths:
            - ./node_modules
jobs:
  job-danger-js:
    docker:
      - image: cimg/node:24.18.0
    resource_class: small
    steps:
      - checkout
      - cmd-install-yarn
      - keeper/env-export:
          secret-url: keeper://TIlcGPFq4rN5GvgnZb9hng/field/password
          var-name: DANGER_GITHUB_API_TOKEN
      - run:
          name: Run Danger JS
          command: cd .circleci/danger && yarn install && yarn run danger
  job-setup:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - keeper/env-export:
          secret-url: keeper://7CgijuGiFDSLynRJt1Dm9w/custom_field/xml
          var-name: MAVEN_SETTINGS
      - run:
          command: "echo $MAVEN_SETTINGS > .gravitee.settings.xml "
      - persist_to_workspace:
          root: .
          paths:
            - .gravitee.settings.xml
  job-validate:
    docker:
      - image: cimg/openjdk:25.0.3
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-validate
      - run:
          name: Validate project
          command: mvn -s .gravitee.settings.xml validate -Dgravitee.archrules.skip=true --no-transfer-progress -Pall-modules -T 8
      - run:
          name: Validate distribution
          command: mvn -s .gravitee.settings.xml -f gravitee-apim-distribution/pom.xml validate -nsu -Dgravitee.archrules.skip=true --no-transfer-progress -Pintegration-tests-modules -T 8
      - run:
          name: Check both reactors carry the same version
          command: |-
            triplet() {
              rev=$(grep -o '<revision>[^<]*</revision>' "$1" | head -1 | sed -E 's#</?revision>##g')
              chg=$(grep -o '<changelist>[^<]*</changelist>' "$1" | head -1 | sed -E 's#</?changelist>##g')
              # <sha1 /> and <sha1></sha1> mean the same thing; normalise both to the empty string.
              sha=$(grep -oE '<sha1 */>|<sha1>[^<]*</sha1>' "$1" | head -1 | sed -E 's#<sha1 */>##; s#</?sha1>##g')
              echo "revision=$rev sha1=$sha changelist=$chg"
            }
            ROOT=$(triplet pom.xml)
            DIST=$(triplet gravitee-apim-distribution/pom.xml)
            echo "root:         $ROOT"
            echo "distribution: $DIST"
            if [ "$ROOT" != "$DIST" ]; then
              echo
              echo "The root pom and the distribution pom disagree on the version being built."
              echo "Both must be bumped together — see release/code-freeze/_common.sh and"
              echo "job-release-commit-and-prepare-next-version."
              exit 1
            fi
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-validate
  job-build:
    docker:
      - image: cimg/openjdk:25.0.3-node
    resource_class: xlarge
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-build
      - cmd-install-yarn
      - run:
          name: Build engine
          command: mvn -s .gravitee.settings.xml clean install --no-transfer-progress --update-snapshots -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=false -T 8 -P all-modules -DwithJavadoc
          environment:
            BUILD_ID: "1234"
            BUILD_NUMBER: "1234"
            GIT_COMMIT: 784ff35ca
            MAVEN_OPTS: -Xmx2048m
      - run:
          name: Build distribution
          command: mvn -s .gravitee.settings.xml -f gravitee-apim-distribution/pom.xml clean install --no-transfer-progress -nsu -DskipTests -Dskip.validation=true -Dgravitee.archrules.skip=false -T 8 -Dbundle=dev -Pengine-snapshot,integration-tests-modules -DwithJavadoc
          environment:
            MAVEN_OPTS: -Xmx2048m
      - cmd-notify-on-failure
      - save_cache:
          paths:
            - ~/.m2/repository/io/gravitee/apim
            - ~/.m2/repository/io/gravitee/gamma
          key: gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - run:
          name: Archive the compiled rest-api classes
          command: tar -cf /tmp/rest-api-classes.tar ./gravitee-apim-rest-api/*/target/classes ./gravitee-apim-rest-api/*/target/test-classes ./gravitee-apim-rest-api/*/*/target/classes ./gravitee-apim-rest-api/*/*/target/test-classes
      - save_cache:
          paths:
            - /tmp/rest-api-classes.tar
          key: gravitee-api-management-v15-rest-api-classes-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
          when: on_success
      - cmd-save-maven-job-cache:
          jobName: job-build
      - persist_to_workspace:
          root: ./
          paths:
            - ./gravitee-apim-rest-api/gravitee-apim-rest-api-management/gravitee-apim-rest-api-management-rest/target/classes/console-openapi.*
            - ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-rest-api/target/distribution
            - ./gravitee-apim-distribution/gravitee-apim-distribution-standalone/gravitee-apim-distribution-standalone-gateway/target/distribution
  job-check-graphene-versions:
    docker:
      - image: cimg/node:24.18.0
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Check graphene versions across bundled Gamma modules
          command: npm ci && npx ts-node src/graphene-versions/check.ts
          working_directory: .circleci/ci
  job-test-rest-api:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - checkout
      - cmd-install-jdk
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-test-rest-api
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - restore_cache:
          keys:
            - gravitee-api-management-v15-rest-api-classes-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Restore the compiled rest-api classes
          command: tar -xf /tmp/rest-api-classes.tar
      - run:
          name: Run Rest API tests
          command: mvn --fail-fast -s .gravitee.settings.xml dependency:properties jacoco:prepare-agent surefire:test --no-transfer-progress -Drest-api-modules -pl '!.,!gravitee-apim-rest-api/gravitee-apim-rest-api-kafka-explorer' -nsu -T 8
      - run:
          name: Aggregate coverage
          command: mvn -s .gravitee.settings.xml org.jacoco:jacoco-maven-plugin:report-aggregate --no-transfer-progress -Drest-api-modules -pl '!.,!gravitee-apim-rest-api/gravitee-apim-rest-api-kafka-explorer' -nsu
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-test-rest-api
      - store_test_results:
          path: ~/test-results
      - persist_to_workspace:
          root: .
          paths:
            - gravitee-apim-rest-api/gravitee-apim-rest-api-coverage/target/site/jacoco-aggregate/
  job-sonarcloud-analysis:
    parameters:
      working_directory:
        type: string
        default: gravitee-apim-rest-api
        description: Directory where the Sonarcloud analysis will be run
      cache_type:
        type: enum
        default: backend
        description: Type of cache to use
        enum:
          - backend
          - frontend
    docker:
      - image: sonarsource/sonar-scanner-cli:11.2
    resource_class: large
    steps:
      - checkout:
          method: full
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - gravitee-api-management-v15-sonarcloud-analysis-<< parameters.cache_type >>
      - keeper/env-export:
          secret-url: keeper://9x9YgyU6DWzux4DPoHAzDQ/field/password
          var-name: SONAR_TOKEN
      - run:
          name: Run Sonarcloud Analysis
          command: sonar-scanner -Dsonar.projectVersion=4.2.0
          working_directory: << parameters.working_directory >>
          no_output_timeout: 30m
      - cmd-notify-on-failure
      - save_cache:
          paths:
            - /opt/sonar-scanner/.sonar/cache
          key: gravitee-api-management-v15-sonarcloud-analysis-<< parameters.cache_type >>
          when: always
  job-test-kafka-explorer:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - checkout
      - cmd-install-jdk
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-test-kafka-explorer
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Run Kafka Explorer tests
          command: mvn --fail-fast -s .gravitee.settings.xml test --no-transfer-progress -Drest-api-modules -pl gravitee-apim-rest-api/gravitee-apim-rest-api-kafka-explorer -Dskip.validation=true -Dgravitee.archrules.skip=true -nsu
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-test-kafka-explorer
      - store_test_results:
          path: ~/test-results
  job-test-gamma:
    docker:
      - image: cimg/openjdk:25.0.3
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-restore-maven-job-cache:
          jobName: job-test-gamma
      - restore_cache:
          keys:
            - gravitee-api-management-v15-build-apim-{{ .Environment.CIRCLE_WORKFLOW_WORKSPACE_ID }}
      - run:
          name: Run Gamma tests
          command: mvn --fail-fast -s .gravitee.settings.xml test --no-transfer-progress -Dgamma-modules -Dskip.validation=true -Dgravitee.archrules.skip=true -Dskip.ui.build=true -nsu -T 4
      - run:
          name: Save test results
          command: |-
            mkdir -p ~/test-results/junit/
            find . -type f -regex ".*/target/surefire-reports/.*xml" -exec cp {} ~/test-results/junit/ \;
          when: always
      - cmd-notify-on-failure
      - cmd-save-maven-job-cache:
          jobName: job-test-gamma
      - store_test_results:
          path: ~/test-results
  job-test-gamma-ui:
    docker:
      - image: cimg/node:24.18.0
    resource_class: large
    steps:
      - checkout
      - cmd-install-yarn
      - cmd-workspace-install
      - run:
          name: Run Prettier, ESLint and license check
          command: yarn nx run-many --target=lint --projects=gravitee-gamma-module-apim,gravitee-gamma-module-platform,gravitee-gamma-module-portals
      - run:
          name: Run unit tests
          command: yarn nx run-many --target=test --projects=gravitee-gamma-module-apim,gravitee-gamma-module-platform,gravitee-gamma-module-portals --maxWorkers=2 --coverage
      - cmd-notify-on-failure
      - store_test_results:
          path: gravitee-gamma/gravitee-gamma-module-apim/coverage/junit.xml
      - store_artifacts:
          path: gravitee-gamma/gravitee-gamma-module-apim/coverage/lcov.info
      - store_test_results:
          path: gravitee-gamma/gravitee-gamma-module-platform/coverage/junit.xml
      - store_artifacts:
          path: gravitee-gamma/gravitee-gamma-module-platform/coverage/lcov.info
      - store_test_results:
          path: gravitee-gamma/gravitee-gamma-module-portals/coverage/junit.xml
      - store_artifacts:
          path: gravitee-gamma/gravitee-gamma-module-portals/coverage/lcov.info
  job-validate-workflow-status:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Check workflow jobs
          command: echo "Congratulations! If you can read this, everything is OK"
workflows:
  pull_requests:
    jobs:
      - job-danger-js:
          name: Run Danger JS
          context:
            - cicd-orchestrator
      - job-setup:
          name: Setup
          context:
            - cicd-orchestrator
      - job-validate:
          name: Validate backend
          context:
            - cicd-orchestrator
          requires:
            - Setup
      - job-build:
          name: Build backend
          context:
            - cicd-orchestrator
          requires:
            - Validate backend
      - job-check-graphene-versions:
          name: Check graphene versions
          context:
            - cicd-orchestrator
          requires:
            - Build backend
      - job-test-rest-api:
          name: Test rest-api
          context:
            - cicd-orchestrator
          requires:
            - Build backend
      - job-sonarcloud-analysis:
          name: Sonar - gravitee-apim-rest-api
          context:
            - cicd-orchestrator
          requires:
            - Test rest-api
          working_directory: gravitee-apim-rest-api
          cache_type: backend
      - job-test-kafka-explorer:
          name: Test kafka-explorer
          context:
            - cicd-orchestrator
          requires:
            - Build backend
      - job-test-gamma:
          name: Test gamma
          context:
            - cicd-orchestrator
          requires:
            - Build backend
      - job-test-gamma-ui:
          name: Test gamma UI
          context:
            - cicd-orchestrator
      - job-validate-workflow-status:
          name: Validate workflow status
          requires:
            - Build backend
            - Check graphene versions
            - Test rest-api
            - Test kafka-explorer
            - Test gamma
            - Test gamma UI
orbs:
  keeper: gravitee-io/keeper@0.7.1
  slack: circleci/slack@4.12.5
