          var-name: AZURE_TENANT
      - keeper/env-export:
          secret-url: keeper://UryantA7MvZe8fkWwcUt8g/field/password
          var-name: AZURE_APPLICATION_SECRET
      - run:
          name: Install Kubectl
          command: |-
            curl -LO https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl
            chmod +x ./kubectl
            mv ./kubectl /usr/local/bin/kubectl
            kubectl version --client=true
      - run:
          name: Rollout pods on "gravitee-devs-preprod-aks-cluster"
          command: |-
            az login --service-principal -u $AZURE_APPLICATION_ID --tenant $AZURE_TENANT -p $AZURE_APPLICATION_SECRET
            az aks get-credentials --admin --resource-group Devs-Preprod-Hosted --name gravitee-devs-preprod-aks-cluster

            kubectl rollout restart deployment -n apim-apim-4-1-x
            kubectl rollout restart deployment -n apim-apim-4-1-x-ce
            kubectl rollout restart deployment -n apim-apim-4-1-x-oem
      - cmd-notify-on-failure
  job-trigger-saas-docker-images:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - run:
          name: Trigger SaaS Docker images pipeline
          command: |-
            PIPELINE_ID=$(curl --request POST --url https://circleci.com/api/v2/project/github/gravitee-io/cloud-distributions/pipeline --header "Circle-Token: ${CIRCLE_TOKEN}" --header 'content-type: application/json' --data '{"parameters":{"project":"apim", "distribution":"dev", "branch-version":"4.1.x", "sha1":"784ff35", "release-version":"", "dry-run":false, "os-distribution":"debian"}}' | jq -r '.id')
            echo "Pipeline triggered with ID: $PIPELINE_ID"
            waitForPipelineCompletion() {
                while true; do
                    STATUS=$(curl --request GET --url "https://circleci.com/api/v2/pipeline/$PIPELINE_ID/workflow" --header "Circle-Token: ${CIRCLE_TOKEN}" | jq -r '.items[].status')
                    echo "Current status: $STATUS"
                    if [[ "$STATUS" == "success" ]]; then
                        echo "Pipeline completed successfully."
                        break
                    elif [[ "$STATUS" == "failed" ]]; then
                        echo "Pipeline failed."
                        exit 1
                    fi
                    sleep 30
                done
            }  
            waitForPipelineCompletion
  job-aikido-scan-docker-images:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - keeper/env-export:
          secret-url: keeper://_XrkO71xa9HZBwxYoUHX0w/field/password
          var-name: AIKIDO_API_KEY
      - cmd-docker-login
      - run:
          name: Pull docker images to scan
          command: |-
            IMAGES="
            graviteeio.azurecr.io/apim-portal-ui:4.1.x-latest
            graviteeio.azurecr.io/apim-management-ui:4.1.x-latest
            graviteeio.azurecr.io/gamma-ui:4.1.x-latest
            graviteeio.azurecr.io/apim-management-api:4.1.x-latest
            graviteeio.azurecr.io/apim-management-api:4.1.x-latest-debian
            graviteeio.azurecr.io/apim-gateway:4.1.x-latest
            graviteeio.azurecr.io/apim-gateway:4.1.x-latest-debian
            "
            : > /tmp/aikido-images.txt
            for image in $IMAGES; do
              if docker pull "$image"; then
                echo "$image" >> /tmp/aikido-images.txt
              else
                echo "WARN: could not pull $image, it will not be scanned"
              fi
            done
            if [ ! -s /tmp/aikido-images.txt ]; then
              echo "ERROR: none of the images could be pulled"
              exit 1
            fi
      - aikido/scan_docker_image:
          built_docker_image_file: /tmp/aikido-images.txt
          fail_on: ""
      - cmd-docker-logout
