  job-trigger-saas-docker-images:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    steps:
      - run:
          name: Trigger SaaS Docker images pipeline
          command: |-
            PIPELINE_ID=$(curl --request POST --url https://circleci.com/api/v2/project/github/gravitee-io/cloud-distributions/pipeline --header "Circle-Token: ${CIRCLE_TOKEN}" --header 'content-type: application/json' --data '{"parameters":{"project":"apim", "distribution":"dev", "branch-version":"master", "sha1":"784ff35", "release-version":"", "dry-run":false, "os-distribution":"debian"}}' | jq -r '.id')
            echo "Pipeline triggered with ID: $PIPELINE_ID"
            waitForPipelineCompletion() {
                while true; do
                    STATUS=$(curl --request GET --url "https://circleci.com/api/v2/pipeline/$PIPELINE_ID/workflow" --header "Circle-Token: ${CIRCLE_TOKEN}" | jq -r '.items[].status')
                    echo "Current status: $STATUS"
                    if [[ "$STATUS" == "success" ]]; then
                        echo "Pipeline completed successfully."
                        break
                    elif [[ "$STATUS" == "failed" ]]; then
                        echo "Pipeline failed."
                        exit 1
                    fi
                    sleep 30
                done
            }  
            waitForPipelineCompletion
  job-aikido-scan-docker-images:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - keeper/env-export:
          secret-url: keeper://_XrkO71xa9HZBwxYoUHX0w/field/password
          var-name: AIKIDO_API_KEY
      - cmd-docker-login
      - run:
          name: Pull docker images to scan
          command: |-
            IMAGES="
            graviteeio.azurecr.io/apim-portal-ui:master-latest
            graviteeio.azurecr.io/apim-portal-ui:master-latest-chainguard
            graviteeio.azurecr.io/apim-management-ui:master-latest
            graviteeio.azurecr.io/apim-management-ui:master-latest-chainguard
            graviteeio.azurecr.io/gamma-ui:master-latest
            graviteeio.azurecr.io/gamma-ui:master-latest-chainguard
            graviteeio.azurecr.io/apim-management-api:master-latest
            graviteeio.azurecr.io/apim-management-api:master-latest-debian
            graviteeio.azurecr.io/apim-management-api:master-latest-chainguard
            graviteeio.azurecr.io/apim-gateway:master-latest
            graviteeio.azurecr.io/apim-gateway:master-latest-debian
            graviteeio.azurecr.io/apim-gateway:master-latest-chainguard
            "
            : > /tmp/aikido-images.txt
            for image in $IMAGES; do
              if docker pull "$image"; then
                echo "$image" >> /tmp/aikido-images.txt
              else
                echo "WARN: could not pull $image, it will not be scanned"
              fi
            done
            if [ ! -s /tmp/aikido-images.txt ]; then
              echo "ERROR: none of the images could be pulled"
              exit 1
            fi
      - aikido/scan_docker_image:
          built_docker_image_file: /tmp/aikido-images.txt
          fail_on: ""
      - cmd-docker-logout
