  job-e2e-test:
    parameters:
      apim_client_tag:
        type: string
        default: ""
      execution_mode:
        type: string
        default: ""
      database:
        type: string
        default: ""
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-docker-login
      - keeper/env-export:
          secret-url: keeper://w8WBpALVCgYdxtV5pVrQsw/custom_field/base64
          var-name: GRAVITEE_LICENSE
      - cmd-install-yarn
      - run:
          name: Running API & E2E tests in << parameters.execution_mode >> mode with << parameters.database >> database
          command: |-
            cd gravitee-apim-distribution/gravitee-apim-distribution-e2e
            if [ "<< parameters.execution_mode >>" = "v3" ]; then
              echo "Disable v4 emulation engine on APIM Gateway and Rest API"
              export V4_EMULATION_ENGINE_DEFAULT=no
            fi
            if [ -z "<< parameters.apim_client_tag >>" ]; then
              APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-latest APIM_CLIENT_REGISTRY=graviteeio.azurecr.io APIM_CLIENT_TAG=master-latest yarn test:api:<< parameters.database >>
            else 
              if [[ "<< parameters.apim_client_tag >>" == *"@"* ]]; then
                echo "Using custom registry for client"
                CLIENT_REGISTRY=$(echo "<< parameters.apim_client_tag >>" | cut -f1 -d@)
                CLIENT_TAG=$(echo "<< parameters.apim_client_tag >>" | cut -f2 -d@)
                APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-latest APIM_CLIENT_REGISTRY=${CLIENT_REGISTRY} APIM_CLIENT_TAG=${CLIENT_TAG} yarn test:api:<< parameters.database >>
              else
                echo "Using ACR registry for client"
                APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-latest APIM_CLIENT_REGISTRY=graviteeio.azurecr.io APIM_CLIENT_TAG=<< parameters.apim_client_tag >> yarn test:api:<< parameters.database >>
              fi
            fi
      - cmd-docker-logout
      - cmd-notify-on-failure
      - store_test_results:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.tmp/e2e-test-report.xml
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.tmp/e2e-test-report.xml
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.logs
  job-e2e-cypress:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - cmd-docker-login
      - keeper/env-export:
          secret-url: keeper://FVzylPCgY-LJsgjkW4q1eQ/field/password
          var-name: CYPRESS_CLOUD_KEY
      - cmd-install-yarn
      - run:
          name: Running UI tests
          command: |-
            cd gravitee-apim-distribution/gravitee-apim-distribution-e2e
            APIM_REGISTRY=graviteeio.azurecr.io APIM_TAG=master-784ff35 yarn test:ui
      - cmd-docker-logout
      - cmd-notify-on-failure
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.tmp/screenshots
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.tmp/videos
      - store_artifacts:
          path: ./gravitee-apim-distribution/gravitee-apim-distribution-e2e/.logs
  job-aikido-scan-docker-images:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: false
    resource_class: medium
    steps:
      - keeper/env-export:
          secret-url: keeper://_XrkO71xa9HZBwxYoUHX0w/field/password
          var-name: AIKIDO_API_KEY
      - cmd-docker-login
      - run:
          name: Pull docker images to scan
          command: |-
            IMAGES="
            graviteeio.azurecr.io/apim-portal-ui:master-latest
            graviteeio.azurecr.io/apim-portal-ui:master-latest-chainguard
            graviteeio.azurecr.io/apim-portal-ui:master-latest-chainguard-fips
            graviteeio.azurecr.io/apim-management-ui:master-latest
            graviteeio.azurecr.io/apim-management-ui:master-latest-chainguard
            graviteeio.azurecr.io/apim-management-ui:master-latest-chainguard-fips
            graviteeio.azurecr.io/gamma-ui:master-latest
            graviteeio.azurecr.io/gamma-ui:master-latest-chainguard
            graviteeio.azurecr.io/gamma-ui:master-latest-chainguard-fips
            graviteeio.azurecr.io/apim-management-api:master-latest
            graviteeio.azurecr.io/apim-management-api:master-latest-debian
            graviteeio.azurecr.io/apim-management-api:master-latest-chainguard
            graviteeio.azurecr.io/apim-management-api:master-latest-chainguard-fips
            graviteeio.azurecr.io/apim-gateway:master-latest
            graviteeio.azurecr.io/apim-gateway:master-latest-debian
            graviteeio.azurecr.io/apim-gateway:master-latest-chainguard
            graviteeio.azurecr.io/apim-gateway:master-latest-chainguard-fips
            "
            : > /tmp/aikido-images.txt
            for image in $IMAGES; do
              if docker pull "$image"; then
                echo "$image" >> /tmp/aikido-images.txt
              else
                echo "WARN: could not pull $image, it will not be scanned"
              fi
            done
            if [ ! -s /tmp/aikido-images.txt ]; then
              echo "ERROR: none of the images could be pulled"
              exit 1
            fi
      - aikido/scan_docker_image:
          built_docker_image_file: /tmp/aikido-images.txt
          fail_on: ""
      - cmd-docker-logout
