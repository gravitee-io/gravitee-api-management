# Used by io.gravitee.apim.infra.template.SecureMemberAccessPolicy.
#
# Types for which NO member (method, field, constructor) is exposed to templates. An entry matches the type itself and
# every subclass / implementation of it, and methods or fields whose declared type is one of those are hidden as well.
# An entry ending with ".*" is a package prefix (it also matches sub-packages).
# Classes are matched by name, so entries for classes that are not on the classpath are harmless.

# Reflection, class loading & modules
java.lang.Class
java.lang.ClassLoader
java.lang.Module
java.lang.ModuleLayer
java.lang.Package
java.lang.StackWalker
java.lang.SecurityManager
java.lang.reflect.*
java.lang.invoke.*
java.lang.instrument.*
java.lang.management.*
java.lang.classfile.*

# Process & runtime
java.lang.Runtime
java.lang.System
java.lang.Process
java.lang.ProcessBuilder
java.lang.ProcessHandle
java.lang.Thread
java.lang.ThreadGroup
java.lang.ScopedValue

# JDK internals (sun.misc.Unsafe, jdk.internal.misc.Unsafe, ...)
sun.*
com.sun.*
jdk.*

# File system, network & I/O
java.io.File
java.io.FileDescriptor
java.io.RandomAccessFile
java.io.InputStream
java.io.OutputStream
java.io.Reader
java.io.Writer
java.io.ObjectInputStream
java.io.ObjectOutputStream
java.nio.file.*
java.nio.channels.*
java.net.*
java.util.ServiceLoader
java.util.concurrent.Executor
java.util.concurrent.ThreadFactory

# Scripting, naming, management, RMI
javax.script.*
javax.naming.*
javax.management.*
java.rmi.*
javax.tools.*

# Template engine internals
freemarker.*

# Container / framework objects giving access to the whole runtime
org.springframework.context.ApplicationContext
org.springframework.beans.factory.BeanFactory
io.vertx.core.Vertx
io.vertx.core.Context
io.vertx.core.file.FileSystem
io.vertx.rxjava3.core.Vertx
io.vertx.rxjava3.core.file.FileSystem
