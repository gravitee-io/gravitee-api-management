# This is a blacklist, that is, methods mentioned here will be not be accessible, but everything else will be.
# Overridden versions of the blacklisted methods are NOT matched by this file (exact java.lang.reflect.Method match),
# which is why dangerous *types* are also denied as a whole in extendedUnsafeClasses.properties.
# Entries referring to a method that does not exist in the running JDK (removed from recent JDKs) are ignored at runtime;
# SecureMemberAccessPolicyTest fails the build for any other unresolvable entry (e.g. a typo).

