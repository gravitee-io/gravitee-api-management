        - name: NATIVE_CONNECTION_STATUS
          label: Native Connection Status
          type: ENUM
          enumValues:
              - CONNECTED
              - DISCONNECTED
              - CONNECTION_ERROR
              - SESSION_ERROR
              - INTERNAL_ERROR
          operators:
              - EQ
              - IN

        # Raw side written by the gateway, as opposed to the logs' derived FAILURE_ORIGIN: analytics
        # cannot replay the error-key classification inside an aggregation. On native Kafka the error
        # key is currently always the catch-all UNKNOWN_SERVER_ERROR, so this is the only usable
        # discriminator of where a connection failed.
        - name: NATIVE_FAILURE_SIDE
          label: Failure Side
          type: ENUM
          enumValues:
              - DOWNSTREAM
              - UPSTREAM
              - INTERNAL
          operators:
              - EQ
              - IN

        # Kafka client.id. The only attribution left on a failed connection: application and plan are
        # unresolved when the failure happens before authentication.
        - name: NATIVE_CLIENT_ID
          label: Kafka Client ID
          signals:
              - LOGS
              - ANALYTICS
          type: KEYWORD
          operators:
              - EQ
              - IN

        # KIP-511 client library advertised at the handshake, e.g. librdkafka / apache-kafka-java.
        # Selectable values come from an aggregation over the v4-metrics index, like the client id
        # above; 'unknown' is among them, and it means "the client advertised no library".
        - name: NATIVE_CLIENT_SOFTWARE_NAME
          label: Kafka Client Library
          signals:
              - LOGS
              - ANALYTICS
          type: KEYWORD
          operators:
              - EQ
              - IN

        # KIP-511 client library version, e.g. 2.6.1. LOGS only, deliberately: grouping by a version
        # without its library gives buckets nobody can read — several clients share version numbers —
        # so this narrows a library rather than standing on its own. Combined with the library filter it
        # answers "who is on librdkafka 1.8", which the library filter alone cannot.
        - name: NATIVE_CLIENT_SOFTWARE_VERSION
          label: Kafka Client Library Version
          signals:
              - LOGS
          type: KEYWORD
          operators:
              - EQ
              - IN

        # Kafka topic name, unbounded, so KEYWORD rather than ENUM. Values are not resolvable from
        # the management database — a value lookup would have to aggregate the event-metrics index.
        - name: NATIVE_TOPIC
          label: Kafka Topic
          type: KEYWORD
          operators:
              - EQ
              - IN

        # Kafka protocol API key (PRODUCE, FETCH, METADATA, ...). A closed set in practice, but one
        # that grows with the Kafka protocol, so it is kept as a KEYWORD rather than frozen here.
        - name: NATIVE_OPERATION
          label: Kafka Operation
          type: KEYWORD
          operators:
              - EQ
              - IN

        - name: AUTHZ_DECISION
          label: Decision
          type: ENUM
          enumValues:
              - PERMIT
              - FORBID
              - NOT_APPLICABLE
          operators:
              - EQ
              - IN

        - name: AUTHZ_OPERATION
          label: Operation
          type: ENUM
