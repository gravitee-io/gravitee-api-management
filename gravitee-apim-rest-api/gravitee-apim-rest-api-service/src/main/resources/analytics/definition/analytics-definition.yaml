              # connection breaks before authenticating — so these two are what an error breakdown
              # can actually group by.
              - NATIVE_FAILURE_SIDE
              - NATIVE_CLIENT_ID
              # The fleet question, and the one client.id cannot answer: an id is near-unique per pod,
              # so grouping by it yields thousands of bars, while the library is a handful of values.
              - NATIVE_CLIENT_SOFTWARE_NAME
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_CONNECTION_STATUS
              - NATIVE_FAILURE_SIDE
              - NATIVE_CLIENT_ID
              - NATIVE_CLIENT_SOFTWARE_NAME

        # --- Native Kafka event metrics ---------------------------------------------------------
        # Served from the `event-metrics` data stream, where the native Kafka reactor flushes its
        # accumulated counters every 5 seconds. One metric per Elasticsearch field: downstream and
        # upstream are distinct fields, not a dimension, so they cannot be a facet (same modelling
        # as LLM_PROMPT_TOKEN_SENT / _RECEIVED).
        #
        # Facets differ per metric on purpose. The `doc-type: api` documents carrying the active
        # connections and the downstream authentication failures have NO plan-id and NO app-id: the
        # reactor records them before a connection is authenticated, so only API is faceteable there.

        - name: NATIVE_MESSAGES_PRODUCED_DOWNSTREAM
          label: Messages Produced (From Clients)
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC

        - name: NATIVE_MESSAGES_PRODUCED_UPSTREAM
          label: Messages Produced (To Broker)
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC

        - name: NATIVE_MESSAGES_CONSUMED_DOWNSTREAM
          label: Messages Consumed (To Clients)
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC

        - name: NATIVE_MESSAGES_CONSUMED_UPSTREAM
          label: Messages Consumed (From Broker)
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC

        - name: NATIVE_BYTES_PRODUCED_DOWNSTREAM
          label: Data Produced (From Clients)
          apis:
              - NATIVE
          unit: BYTES
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_TOPIC

        - name: NATIVE_BYTES_PRODUCED_UPSTREAM
