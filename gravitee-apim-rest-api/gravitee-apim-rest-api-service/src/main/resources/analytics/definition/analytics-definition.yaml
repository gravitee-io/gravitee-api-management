              - PLAN
              - NATIVE_TOPIC

        # Gauges. MAX is the peak observed in a bucket — on a multi-gateway deployment that is the
        # busiest gateway, NOT the environment total. Never label these as a total.
        - name: NATIVE_ACTIVE_CONNECTIONS_DOWNSTREAM
