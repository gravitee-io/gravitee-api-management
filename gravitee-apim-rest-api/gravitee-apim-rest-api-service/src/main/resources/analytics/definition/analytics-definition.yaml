        # Operation counters. These count Kafka *requests*, not messages: producing 50 records in one
        # batch is a single PRODUCE. The gaps between them are meaningful — received minus forwarded
        # is what never reached the broker (policy interrupt, ACL denial, locally-generated
        # response), and forwarded minus answered is the broker not responding.
        - name: NATIVE_OPERATIONS_RECEIVED
          label: Operations Received
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

        - name: NATIVE_OPERATIONS_FORWARDED
          label: Operations Forwarded to Broker
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

        - name: NATIVE_OPERATIONS_ANSWERED
          label: Operations Answered by Broker
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
