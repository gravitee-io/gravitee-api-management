              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

        - name: NATIVE_OPERATIONS_COMPLETED
          label: Operations Completed
          apis:
              - NATIVE
          unit: NUMBER
          measures:
              - SUM
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

        # Latency decomposition of one Kafka request. The three phases sum up to the end-to-end
        # latency, which is what makes "gateway or broker?" answerable at a glance.
        #
        # AVG only: the reactor stores the SUM of the durations observed in each 5s window, so a
        # percentile would describe the distribution of window sums, not of operation latencies. The
        # average is derived as sum(durations)/sum(samples), each phase having its own sample counter.
        - name: NATIVE_OPERATION_GATEWAY_REQUEST_DURATION
          label: Gateway Request Processing Time
          apis:
              - NATIVE
          unit: MILLISECONDS
          measures:
              - AVG
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

        - name: NATIVE_OPERATION_BROKER_DURATION
          label: Broker Response Time
          apis:
              - NATIVE
          unit: MILLISECONDS
          measures:
              - AVG
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

        - name: NATIVE_OPERATION_GATEWAY_RESPONSE_DURATION
          label: Gateway Response Processing Time
          apis:
              - NATIVE
          unit: MILLISECONDS
          measures:
              - AVG
          facets:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION
          filters:
              - API
              - APPLICATION
              - PLAN
              - NATIVE_OPERATION

