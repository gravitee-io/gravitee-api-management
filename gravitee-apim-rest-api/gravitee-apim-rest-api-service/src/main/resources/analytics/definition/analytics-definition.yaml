              - EQ
              - IN

        - name: AUTHZ_CALLER
          label: Caller
          type: ENUM
          enumValues:
              - pep
              - gateway
              - authzen
              - unknown
          operators:
              - EQ
              - IN

        - name: AUTHZ_SUBJECT_ID
          label: Subject ID
          type: STRING
          operators:
              - EQ
              - IN

        - name: AUTHZ_ACTION
          label: Action
          type: STRING
          operators:
              - EQ
              - IN

