        - name: HTTP_STATUS
          label: Status Code
          signals:
              - LOGS
              - ANALYTICS
          type: NUMBER
          range:
              from: 100
              to: 599
          operators:
              - EQ
              - LTE
              - GTE

        # EQ only: the logs engine matches a single exact path, and IN over full paths has no
        # known consumer. Gamma's reconciled vocabulary made the same call (URI is EQ-only).
        - name: HTTP_PATH
          label: HTTP Path
          signals:
              - LOGS
              - ANALYTICS
          type: STRING
          operators:
              - EQ

        - name: HTTP_PATH_MAPPING
          label: Path Mapping
          type: KEYWORD
          operators:
