<div class="container">
  <gmd-form-host [content]="value">
    <div class="container__editor-preview" [class.container__editor-preview--editor-only]="!showPreview()">
      <gmd-monaco-editor
        class="container__inner-border"
        [value]="value"
        [readOnly]="isDisabled"
        (valueChange)="onValueChange($event)"
        (touched)="onTouched()"
      />
      <!-- Hidden, never removed: the fields the preview renders are what the validation panel reads. -->
      <hr class="hr" [hidden]="!showPreview()" />
      <div class="container__inner-border container__preview" [hidden]="!showPreview()">
        <gmd-viewer [content]="value" />
      </div>
    </div>
    <div class="container__form-status">
      <gmd-form-validation-panel />
    </div>
  </gmd-form-host>
</div>
